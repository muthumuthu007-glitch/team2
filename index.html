          '</div>' +
          (row ? '<span class="sec-note">Staff link to this schedule, so saving applies to ' +
                 '<b>all ' + n + ' staff currently assigned</b> — there is no per-person copy to update.</span>'
               : '') +
        '</div>');

      $("sc-name").value = row ? row.name : "";
      $("sc-in").value   = row ? hm(row.start_time) : "";
      $("sc-out").value  = row ? hm(row.end_time) : "";
      [1, 2, 3].forEach(function (i) {
        $("sc-t" + i + "f").value = row ? hm(row["tea" + i + "_from"]) : "";
        $("sc-t" + i + "t").value = row ? hm(row["tea" + i + "_to"]) : "";
        $("sc-t" + i + "m").value = row ? (row["tea" + i + "_min"] || 0) : 15;
      });
      $("sc-lf").value = row ? hm(row.lunch_from) : "";
      $("sc-lt").value = row ? hm(row.lunch_to) : "";
      $("sc-lm").value = row ? (row.lunch_min || 0) : 45;
      $("sc-perm").value = row ? Number(row.permission_hours) : 3;
      $("sc-active").checked = row ? !!row.active : true;

      $("sc-cancel").addEventListener("click", closeModal);
      $("sc-name").focus();

      $("sc-save").addEventListener("click", async function () {
        var name = $("sc-name").value.trim();
        var msg = $("sc-msg");
        if (!name) { setMsg(msg, "Enter the schedule name"); return; }
        if (!$("sc-in").value || !$("sc-out").value) {
          setMsg(msg, "Set day check-in and check-out"); return;
        }
        var clash = rows.some(function (r) {
          return r.name.toLowerCase() === name.toLowerCase() && (!row || r.id !== row.id);
        });
        if (clash) { setMsg(msg, "A schedule with that name already exists"); return; }

        var payload = {
          name: name,
          start_time: $("sc-in").value,
          end_time: $("sc-out").value,
          lunch_from: $("sc-lf").value || null,
          lunch_to: $("sc-lt").value || null,
          lunch_min: parseInt($("sc-lm").value, 10) || 0,
          permission_hours: parseFloat($("sc-perm").value) || 0,
          active: $("sc-active").checked
        };
        [1, 2, 3].forEach(function (i) {
          payload["tea" + i + "_from"] = $("sc-t" + i + "f").value || null;
          payload["tea" + i + "_to"]   = $("sc-t" + i + "t").value || null;
          payload["tea" + i + "_min"]  = parseInt($("sc-t" + i + "m").value, 10) || 0;
        });

        $("sc-save").disabled = true;
        setMsg(msg, "Saving…", true);
        var r = row
          ? await sb.from("shifts").update(payload).eq("id", row.id)
          : await sb.from("shifts").insert(Object.assign({ created_by: me.id }, payload));
        $("sc-save").disabled = false;
        if (r.error) { setMsg(msg, saveError(r.error)); return; }
        closeModal();
        load();
      });
    }

    load();
  }

  // ---------- Unit master ----------
  // Stored in team2.locations — the table keeps its name because profiles.location_id,
  // the RLS helpers and role_permissions.menu_id = 'locations' all key on it.
  var UNIT_FALLBACK_CENTER = { lat: 11.1085, lng: 77.3411 };   // Tirupur
  var units = [];

  function geoSummary(u) {
    if (u.geofence_type === "polygon") {
      var n = Array.isArray(u.geofence_polygon) ? u.geofence_polygon.length : 0;
      return "Polygon · " + n + " point" + (n === 1 ? "" : "s");
    }
    return "Circle · " + (u.geofence_m || 0) + " m";
  }

  function renderUnits(host) {
    var mayEdit = canEditMenu("locations");
    host.innerHTML =
      '<div class="panel toolbar">' +
        '<input class="txt search" id="uSearch" type="search" placeholder="Search name, code or address">' +
        '<label class="chk"><input type="checkbox" id="uInactive"> Show inactive</label>' +
        (mayEdit ? '<button class="go compact" id="uAdd" type="button">Add unit</button>' : '') +
      '</div>' +
      '<div class="rows" id="uRows"><div class="panel state">Loading…</div></div>';

    $("uSearch").addEventListener("input", paint);
    $("uInactive").addEventListener("change", paint);
    if (mayEdit) $("uAdd").addEventListener("click", function () { unitForm(null); });

    function paint() {
      var q = $("uSearch").value.trim().toLowerCase();
      var showOff = $("uInactive").checked;
      var list = units.filter(function (u) {
        if (!u.active && !showOff) return false;
        if (!q) return true;
        return [u.name, u.location_code, u.address, u.city].join(" ").toLowerCase().indexOf(q) !== -1;
      });

      var host2 = $("uRows");
      if (!list.length) {
        host2.innerHTML = '<div class="panel state">' +
          (units.length ? "No unit matches that search." : "No units yet." +
            (mayEdit ? " Use <b>Add unit</b> to create the first one." : "")) + '</div>';
        return;
      }
      host2.innerHTML = list.map(function (u) {
        return '<div class="row-card">' +
          '<div class="row-main">' +
            '<span class="row-code">' + esc(u.location_code) + '</span>' +
            '<span class="row-name">' + esc(u.name) + '</span>' +
            (u.address || u.city ? '<span class="row-meta">' +
              esc([u.address, u.city, u.pincode].filter(Boolean).join(", ")) + '</span>' : '') +
            '<span class="row-meta">' + esc(geoSummary(u)) +
              ' · buffer ' + (u.geofence_buffer_m || 0) + ' m' +
              (u.lat != null ? ' · ' + Number(u.lat).toFixed(5) + ", " + Number(u.lng).toFixed(5) : ' · no point set') +
            '</span>' +
          '</div>' +
          '<div class="row-acts">' +
            '<span class="pill ' + (u.active ? "on" : "off") + '">' + (u.active ? "Active" : "Inactive") + '</span>' +
            (mayEdit ? '<button class="mini" data-edit="' + u.id + '" type="button">Edit</button>' +
                       '<button class="mini danger" data-del="' + u.id + '" type="button">Delete</button>' : '') +
          '</div>' +
        '</div>';
      }).join("");

      host2.querySelectorAll("[data-edit]").forEach(function (b) {
        b.addEventListener("click", function () {
          unitForm(units.filter(function (u) { return u.id === b.dataset.edit; })[0]);
        });
      });
      host2.querySelectorAll("[data-del]").forEach(function (b) {
        b.addEventListener("click", function () { removeUnit(b.dataset.del); });
      });
    }

    async function load() {
      var r = await sb.from("locations").select("*").order("location_code");
      if (r.error) {
        $("uRows").innerHTML = '<div class="panel state">Could not load units — ' + esc(r.error.message) + '</div>';
        return;
      }
      units = r.data || [];
      paint();
    }

    async function removeUnit(id) {
      var u = units.filter(function (x) { return x.id === id; })[0];
      if (!u) return;
      if (!window.confirm('Delete "' + u.name + '"? This cannot be undone.')) return;
      var r = await sb.from("locations").delete().eq("id", id);
      if (r.error) { window.alert(saveError(r.error)); return; }
      load();
    }

    renderUnits.reload = load;
    load();
  }

  // ---------- Add / edit a unit ----------
  function unitForm(row) {
    var st = {
      type: (row && row.geofence_type) || "circle",
      lat: row && row.lat != null ? Number(row.lat) : null,
      lng: row && row.lng != null ? Number(row.lng) : null,
      radius: row && row.geofence_m ? Number(row.geofence_m) : 200,
      polygon: row && Array.isArray(row.geofence_polygon) ? row.geofence_polygon.slice() : [],
      map: null, circle: null, poly: null
    };

    openModal(row ? "Edit unit" : "Add unit",
      '<div class="form-grid">' +
        '<div class="field"><label for="u-name">Unit name</label>' +
          '<input class="txt" id="u-name" type="text" placeholder="e.g. CTPL-PD" autocomplete="off"></div>' +
        '<div class="field"><label for="u-addr">Unit address</label>' +
          '<input class="txt" id="u-addr" type="text" placeholder="Start typing to search" autocomplete="off"></div>' +
        '<div class="form-2">' +
          '<div class="field"><label for="u-city">City</label><input class="txt" id="u-city" type="text" autocomplete="off"></div>' +
          '<div class="field"><label for="u-pin">Pincode</label><input class="txt" id="u-pin" type="text" inputmode="numeric" autocomplete="off"></div>' +
        '</div>' +
        '<label class="chk"><input type="checkbox" id="u-active" checked> Active</label>' +

        '<div class="sec">' +
          '<span class="sec-title">Geofence</span>' +
          '<div class="radio-row">' +
            '<label><input type="radio" name="u-gf" value="circle"> Circle</label>' +
            '<label><input type="radio" name="u-gf" value="polygon"> Polygon (custom drawn)</label>' +
          '</div>' +
          '<div class="map-box" id="uMap"></div>' +
          '<div class="map-tools" id="uCircleRow">' +
            '<div class="field" style="flex:1 1 150px"><label for="u-radius">Radius (metres)</label>' +
              '<input class="txt" id="u-radius" type="number" min="20" max="5000" step="10"></div>' +
          '</div>' +
          '<div class="map-tools" id="uPolyRow" hidden>' +
            '<span class="hint">Click the map to add corners (min 3), drag them to adjust. ' +
              '<b><span id="uPolyCount">0</span> points</b></span>' +
            '<button class="mini" id="uUndo" type="button">Undo point</button>' +
            '<button class="mini" id="uClear" type="button">Clear</button>' +
          '</div>' +
          '<div class="field"><label for="u-buffer">Buffer (metres – extra tolerance)</label>' +
            '<input class="txt" id="u-buffer" type="number" min="0" max="5000" step="10"></div>' +
        '</div>' +

        '<div class="msg" id="uMsg"></div>' +
        '<div class="modal-acts">' +
          '<button class="mini" id="uCancel" type="button">Cancel</button>' +
          '<button class="go compact" id="uSave" type="button">Save unit</button>' +
        '</div>' +
      '</div>');

    $("u-name").value    = row ? (row.name || "") : "";
    $("u-addr").value    = row ? (row.address || "") : "";
    $("u-city").value    = row ? (row.city || "") : "";
    $("u-pin").value     = row ? (row.pincode || "") : "";
    $("u-active").checked = row ? !!row.active : true;
    $("u-radius").value  = st.radius;
    $("u-buffer").value  = row && row.geofence_buffer_m != null ? row.geofence_buffer_m : 100;
    document.querySelectorAll('input[name="u-gf"]').forEach(function (r2) {
      r2.checked = r2.value === st.type;
      r2.addEventListener("change", function () { if (r2.checked) setType(r2.value); });
    });

    $("uCancel").addEventListener("click", closeModal);
    $("u-radius").addEventListener("input", function () {
      var v = parseInt(this.value, 10);
      if (!isFinite(v)) return;
      st.radius = v;
      if (st.circle) st.circle.setRadius(v);
    });
    $("uSave").addEventListener("click", save);

    function setType(t) {
      st.type = t;
      $("uCircleRow").hidden = t !== "circle";
      $("uPolyRow").hidden = t !== "polygon";
      if (st.circle) st.circle.setMap(t === "circle" ? st.map : null);
      if (st.poly) st.poly.setMap(t === "polygon" ? st.map : null);
    }
    setType(st.type);

    initUnitMap(st);

    async function save() {
      var name = $("u-name").value.trim();
      var msg = $("uMsg");
      if (!name) { setMsg(msg, "Enter the unit name"); return; }
      if (st.type === "polygon" && st.polygon.length < 3) {
        setMsg(msg, "Draw at least 3 corners on the map, or switch to Circle"); return;
      }
      if (st.type === "circle" && (st.lat == null || st.lng == null)) {
        setMsg(msg, "Set the unit's point on the map first"); return;
      }

      var payload = {
        name: name,
        address: $("u-addr").value.trim() || null,
        city: $("u-city").value.trim() || null,
        pincode: $("u-pin").value.trim() || null,
        active: $("u-active").checked,
        geofence_type: st.type,
        geofence_buffer_m: parseInt($("u-buffer").value, 10) || 0
      };
      if (st.type === "circle") {
        payload.lat = st.lat; payload.lng = st.lng;
        payload.geofence_m = st.radius;
        payload.geofence_polygon = null;
      } else {
        payload.geofence_polygon = st.polygon;
        var c = centroid(st.polygon);
        payload.lat = c.lat; payload.lng = c.lng;
      }

      $("uSave").disabled = true;
      setMsg(msg, "Saving…", true);
      var r = row
        ? await sb.from("locations").update(payload).eq("id", row.id)
        : await sb.from("locations").insert(Object.assign({ created_by: me.id }, payload));
      $("uSave").disabled = false;
      if (r.error) { setMsg(msg, saveError(r.error)); return; }
      closeModal();
      if (renderUnits.reload) renderUnits.reload();
    }
  }

  function centroid(pts) {
    var la = 0, ln = 0;
    pts.forEach(function (p) { la += Number(p.lat); ln += Number(p.lng); });
    return { lat: la / pts.length, lng: ln / pts.length };
  }

  // The map. DrawingManager was removed from the Maps JS API in 3.65, so the
  // polygon is drawn by hand: map clicks push vertices onto an editable Polygon.
  async function initUnitMap(st) {
    var box = $("uMap");
    var maps;
    try { maps = await GMaps.load(); }
    catch (e) { maps = null; }

    if (!maps) {
      box.innerHTML = '<div class="map-off">' +
        '<b>Map not available</b>' +
        '<span>No Google Maps key is set, so the geofence cannot be drawn yet. ' +
        'Name, address and buffer still save.</span></div>';
      return;
    }

    var center = (st.lat != null && st.lng != null) ? { lat: st.lat, lng: st.lng } : UNIT_FALLBACK_CENTER;
    st.map = new maps.Map(box, {
      center: center, zoom: (st.lat != null ? 17 : 12),
      mapTypeId: "hybrid", streetViewControl: false, fullscreenControl: false, mapTypeControl: true
    });

    var style = { fillColor: "#4169e1", fillOpacity: 0.12, strokeColor: "#4169e1", strokeWeight: 2 };

    st.circle = new maps.Circle(Object.assign({
      map: null, center: center, radius: st.radius, editable: true, draggable: true
    }, style));
    st.circle.addListener("radius_changed", function () {
      st.radius = Math.round(st.circle.getRadius());
      if ($("u-radius")) $("u-radius").value = st.radius;
    });
    st.circle.addListener("center_changed", function () {
      var c = st.circle.getCenter();
      st.lat = c.lat(); st.lng = c.lng();
    });

    st.poly = new maps.Polygon(Object.assign({ map: null, paths: st.polygon, editable: true }, style));
    function syncPoly() {
      var path = st.poly.getPath();
      st.polygon = [];
      for (var i = 0; i < path.getLength(); i++) {
        var q = path.getAt(i);
        st.polygon.push({ lat: q.lat(), lng: q.lng() });
      }
      if ($("uPolyCount")) $("uPolyCount").textContent = st.polygon.length;
    }
    ["insert_at", "set_at", "remove_at"].forEach(function (ev) {
      st.poly.getPath().addListener(ev, syncPoly);
    });
    syncPoly();

    // A click drops a polygon corner, or moves the circle when none is set yet.
    st.map.addListener("click", function (e) {
      if (st.type === "polygon") { st.poly.getPath().push(e.latLng); return; }
      st.circle.setCenter(e.latLng);
      st.lat = e.latLng.lat(); st.lng = e.latLng.lng();
    });

    if ($("uUndo")) $("uUndo").addEventListener("click", function () {
      var path = st.poly.getPath();
      if (path.getLength()) path.removeAt(path.getLength() - 1);
    });
    if ($("uClear")) $("uClear").addEventListener("click", function () { st.poly.getPath().clear(); });

    // Put the shapes on the map for whichever type is selected.
    st.circle.setMap(st.type === "circle" ? st.map : null);
    st.poly.setMap(st.type === "polygon" ? st.map : null);

    // Address search — recentres the map and moves the circle with it.
    GMaps.autocomplete($("u-addr"), function (place) {
      if (place.address) $("u-addr").value = place.address;
      var at = { lat: place.lat, lng: place.lng };
      st.map.setCenter(at); st.map.setZoom(17);
      if (st.type === "circle") {
        st.circle.setCenter(at); st.lat = at.lat; st.lng = at.lng;
      }
    });
  }

  // ---------- Google Maps ----------
  // Loaded on demand, once, and only when a key is configured. Every caller
  // resolves to null when there is no key, so screens degrade to raw lat/lng.
  var GMaps = (function () {
    var loading = null;

    function load() {
      if (!CFG.gmapsKey) return Promise.resolve(null);
      if (loading) return loading;
      loading = new Promise(function (resolve, reject) {
        var s = document.createElement("script");
        s.src = "https://maps.googleapis.com/maps/api/js?key=" +
                encodeURIComponent(CFG.gmapsKey) + "&libraries=places&loading=async";
        s.async = true;
        s.onload = function () { resolve(window.google && window.google.maps ? window.google.maps : null); };
        s.onerror = function () { reject(new Error("Google Maps failed to load")); };
        document.head.appendChild(s);
      });
      return loading;
    }

    // Browser GPS. Always available — no Google key needed.
    function here(opts) {
      return new Promise(function (resolve, reject) {
        if (!navigator.geolocation) { reject(new Error("This device has no GPS")); return; }
        navigator.geolocation.getCurrentPosition(
          function (p) {
            resolve({
              lat: p.coords.latitude, lng: p.coords.longitude,
              accuracy_m: p.coords.accuracy,
              speed_kmph: p.coords.speed == null ? null : p.coords.speed * 3.6,
              heading: p.coords.heading, at: new Date(p.timestamp).toISOString()
            });
          },
          function (e) { reject(new Error(e.code === 1 ? "Location permission denied" : "Could not get your location")); },
          Object.assign({ enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }, opts || {})
        );
      });
    }

    // Geocoding API — lat/lng to a street address.
    async function address(lat, lng) {
      var maps = await load();
      if (!maps) return null;
      var res = await new Promise(function (resolve) {
        new maps.Geocoder().geocode({ location: { lat: lat, lng: lng } }, function (r, status) {
          resolve(status === "OK" && r && r.length ? r[0] : null);
        });
      });
      return res ? { text: res.formatted_address, place_id: res.place_id } : null;
    }

    // Places API — attach autocomplete to a text input; onPick gets name/address/lat/lng/place_id.
    async function autocomplete(input, onPick) {
      var maps = await load();
      if (!maps || !maps.places) return null;
      var ac = new maps.places.Autocomplete(input, {
        fields: ["name", "formatted_address", "geometry", "place_id"],
        componentRestrictions: { country: "in" }
      });
      ac.addListener("place_changed", function () {
        var p = ac.getPlace();
        if (!p || !p.geometry) return;
        onPick({
          name: p.name, address: p.formatted_address, place_id: p.place_id,
          lat: p.geometry.location.lat(), lng: p.geometry.location.lng()
        });
      });
      return ac;
    }

    // Distance Matrix API — driving road distance in km between two points.
    async function roadKm(from, to) {
      var maps = await load();
      if (!maps) return null;
      var r = await new Promise(function (resolve) {
        new maps.DistanceMatrixService().getDistanceMatrix({
          origins: [{ lat: from.lat, lng: from.lng }],
          destinations: [{ lat: to.lat, lng: to.lng }],
          travelMode: "DRIVING"
        }, function (res, status) {
          var e = status === "OK" && res && res.rows[0] && res.rows[0].elements[0];
          resolve(e && e.status === "OK" ? e : null);
        });
      });
      return r ? { km: r.distance.value / 1000, minutes: Math.round(r.duration.value / 60) } : null;
    }

    return { load: load, here: here, address: address, autocomplete: autocomplete, roadKm: roadKm,
             enabled: function () { return !!CFG.gmapsKey; } };
  })();

  window.Team2 = { sb: sb, GMaps: GMaps, me: function () { return me; } };

  // ---------- Session ----------
  // `mode` is passed only on a fresh sign-in, so a tab's role rule is checked then —
  // a reload with a live session goes straight in.
  async function startSession(mode) {
    var s = await sb.auth.getSession();
    if (!s.data.session) { show("scr-login"); return false; }
    var uname = (s.data.session.user.email || "").split("@")[0];

    var r = await sb.from("profiles").select("*").eq("username", uname).maybeSingle();
    if (r.error) { setMsg($("loginMsg"), "Could not load your profile"); show("scr-login"); return false; }
    if (!r.data) {
      setMsg($("loginMsg"), "No user profile for this login");
      await sb.auth.signOut(); show("scr-login"); return false;
    }
    if (!r.data.active) {
      setMsg($("loginMsg"), "This account is inactive");
      await sb.auth.signOut(); show("scr-login"); return false;
    }
    if (mode && mode.roles && mode.roles.indexOf(r.data.role) === -1) {
      setMsg($("loginMsg"), mode.deniedMsg);
      await sb.auth.signOut(); show("scr-login"); return false;
    }

    me = r.data;
    await loadMyAccess();
    setMsg($("loginMsg"), "");
    $("whoName").textContent = me.name || me.username;
    $("whoRole").textContent = me.role;
    renderTree();

    var want = (location.hash || "").replace("#", "");
    if (want && MENU_BY_ID[want]) openModule(want); else goHome();
    return true;
  }

  function signOut() {
    sb.auth.signOut();
    closeDrawer();
    me = null; myAccess = {}; currentId = null;
    $("f-u").value = ""; $("f-p").value = "";
    setMsg($("loginMsg"), "");
    location.hash = "";
    show("scr-login");
  }

  // ---------- Wiring ----------
  $("loginVer").textContent = "Ver " + CFG.version;
  $("lgYear").textContent = new Date().getFullYear();

  // ---------- Login tabs ----------
  // Gate is deliberately left out. Visitor has no role or module yet, so its form
  // does not sign anyone in until that is specified.
  var LOGIN_MODES = {
    admin:   { head: "Admin Sign In",   sub: "Manage staff, visits & approvals", btn: "Login as Admin",
               roles: ["superadmin", "admin", "manager"],
               deniedMsg: "This account has no admin access \u2014 sign in on the Team tab" },
    team:    { head: "Team Sign In",    sub: "Attendance, visits & requests",     btn: "Login as Team" },
    visitor: { head: "Visitor Sign In", sub: "Sign in for your visit",            btn: "Login as Visitor",
               notReady: true }
  };
  var TAB_ORDER = ["admin", "team", "visitor"];
  var loginMode = "admin";
  try {
    var savedMode = localStorage.getItem("team2.loginMode");
    if (LOGIN_MODES[savedMode]) loginMode = savedMode;
  } catch (e) { /* storage blocked — the default tab is fine */ }

  function setLoginMode(mode, focusTab) {
    loginMode = mode;
    var cfg = LOGIN_MODES[mode];
    document.querySelectorAll(".lg-tab").forEach(function (t) {
      var on = t.dataset.mode === mode;
      t.setAttribute("aria-selected", on ? "true" : "false");
      t.tabIndex = on ? 0 : -1;
      if (on && focusTab) t.focus();
    });
    $("lgHead").textContent = cfg.head;
    $("lgSub").textContent = cfg.sub;
    $("loginBtn").textContent = cfg.btn;
    setMsg($("loginMsg"), "");
    try { localStorage.setItem("team2.loginMode", mode); } catch (e) { /* ignore */ }
  }

  document.querySelectorAll(".lg-tab").forEach(function (t) {
    t.addEventListener("click", function () { setLoginMode(t.dataset.mode); });
    t.addEventListener("keydown", function (e) {
      var i = TAB_ORDER.indexOf(loginMode);
      if (e.key === "ArrowRight") { e.preventDefault(); setLoginMode(TAB_ORDER[(i + 1) % 3], true); }
      if (e.key === "ArrowLeft")  { e.preventDefault(); setLoginMode(TAB_ORDER[(i + 2) % 3], true); }
    });
  });
  setLoginMode(loginMode);

  // Mobile numbers only: digits, ten of them.
  $("f-u").addEventListener("input", function () {
    var digits = this.value.replace(/\D/g, "").slice(0, 10);
    if (digits !== this.value) this.value = digits;
  });

  $("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    var cfg = LOGIN_MODES[loginMode];
    var u = $("f-u").value.trim();
    var p = $("f-p").value;
    $("f-p").value = "";
    if (cfg.notReady) { setMsg($("loginMsg"), "Visitor sign-in isn't set up yet"); return; }
    if (!u || !p) { setMsg($("loginMsg"), "Enter mobile number and password"); return; }
    $("loginBtn").disabled = true;
    setMsg($("loginMsg"), "Signing in…", true);
    try {
      var res = await sb.auth.signInWithPassword({ email: emailOf(u), password: p });
      if (res.error) { setMsg($("loginMsg"), "Invalid credentials"); return; }
      await startSession(cfg);
    } catch (err) {
      setMsg($("loginMsg"), "Could not reach the server — check your connection");
    } finally {
      $("loginBtn").disabled = false;
    }
  });

  $("btnOut").addEventListener("click", signOut);
  $("btnDrawer").addEventListener("click", openDrawer);
  $("btnDrawerClose").addEventListener("click", closeDrawer);
  $("scrim").addEventListener("click", closeDrawer);
  $("modalX").addEventListener("click", closeModal);
  $("modal").addEventListener("click", function (e) {
    if (e.target === $("modal")) closeModal();      // backdrop only, never the card
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (!$("modal").hidden) closeModal(); else closeDrawer();
  });

  window.addEventListener("hashchange", function () {
    if (!me) return;
    var want = (location.hash || "").replace("#", "");
    if (want && MENU_BY_ID[want]) openModule(want); else goHome();
  });

  startSession();
})();
</script>
</body>
</html>
