<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2f4bd0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Team2</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
  // Team2 — attendance, leave, permission and field visits.
  // Production host: https://team2.carloo.in (not attached yet).
  // Data lives in the `team2` schema of the carloo-order-management project.
  window.APP_CFG = {
    version: "0.9.7",
    url: "https://thmszlxepqkrcqavlilq.supabase.co",
    key: "sb_publishable_JUznnQZytWQo_l-EC9N3Sw_uCfArTet",

    // Google Maps browser key. Leave "" and every map feature stays off — the app
    // still records raw lat/lng. Enable on the key: Maps JavaScript API,
    // Geocoding API, Places API, Distance Matrix API. Restrict it by HTTP referrer
    // to team2.carloo.in and http://127.0.0.1:8127.
    gmapsKey: ""
  };
</script>
<style>
  :root {
    --bg: #f5f6fa;
    --panel: #ffffff;
    --brand: #2f4bd0;
    --brand-deep: #2439a6;
    --brand-soft: #e9ecfb;
    --ink: #1b2033;
    --text: #2c3244;
    --muted: #878da0;
    --border: #e4e6ef;
    --error: #b3382c;
    --ok: #1c7a4b;
    --warn: #a76a12;
    --shadow: 0 1px 2px rgba(27, 32, 51, 0.06), 0 8px 24px rgba(27, 32, 51, 0.07);
    --serif: Georgia, "Times New Roman", "Noto Serif", serif;
    --pad: max(14px, env(safe-area-inset-left));
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }   /* beats .map-tools { display: flex } etc. */
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
  }
  .screen { display: none; min-height: 100%; }
  .screen.active { display: block; }

  /* ---------- Brand ---------- */
  .brand { display: flex; align-items: center; gap: 11px; user-select: none; }
  .brand .logo {
    width: 42px; height: 42px; border-radius: 13px;
    background: var(--brand); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-size: 22px; font-weight: 700; flex: 0 0 auto;
  }
  .brand .word {
    font-family: var(--serif); font-size: 25px; font-weight: 700;
    color: var(--ink); letter-spacing: 0.01em; line-height: 1.1;
  }
  .brand .sub {
    display: block; font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 9.5px; font-weight: 700; color: var(--muted);
    letter-spacing: 0.15em; text-transform: uppercase; margin-top: 3px;
  }
  .brand.small .logo { width: 34px; height: 34px; border-radius: 10px; font-size: 18px; }
  .brand.small .word { font-size: 19px; }

  /* ---------- Shared ---------- */
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px; box-shadow: var(--shadow);
  }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field label, .sec-title {
    font-size: 11px; color: var(--muted);
    letter-spacing: 0.13em; text-transform: uppercase;
    font-weight: 600; user-select: none;
  }
  input.txt, select.txt, textarea.txt {
    background: #fbfcfe; border: 1px solid var(--border); border-radius: 11px;
    color: var(--text); font: inherit; font-size: 16px;   /* 16px stops iOS zoom-on-focus */
    padding: 12px 13px; outline: none; caret-color: var(--brand); width: 100%;
  }
  input.txt:focus, select.txt:focus, textarea.txt:focus { border-color: var(--brand); background: #fff; }
  button.go {
    background: var(--brand); color: #fff; border: none; border-radius: 11px;
    font: inherit; font-weight: 600; font-size: 16px;
    padding: 14px 0; cursor: pointer; width: 100%;
  }
  button.go:active { background: var(--brand-deep); transform: translateY(1px); }
  button.go[disabled] { opacity: 0.55; }
  .msg { min-height: 18px; font-size: 13px; text-align: center; user-select: none; }
  .msg.err { color: var(--error); }
  .msg.ok  { color: var(--ok); }

  /* ---------- Login (Carloo Tex look) ---------- */
  #scr-login { display: none; }
  #scr-login.active {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh;
    padding: calc(34px + env(safe-area-inset-top)) var(--pad) calc(26px + env(safe-area-inset-bottom));
    background: linear-gradient(135deg, #f6f8fe 0%, #ffffff 48%, #f8f7fd 100%);
    --lg-blue: #4169e1;
  }
  .lg-head { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 30px; }
  .lg-logo { background: #fff; padding: 4px 14px 8px; margin-bottom: 20px; line-height: 1; }
  .lg-wordmark {
    position: relative; display: inline-block;
    font-family: Calibri, Candara, "Segoe UI", system-ui, sans-serif;
    font-size: 62px; font-weight: 400; color: #231f20; letter-spacing: -1.2px;
  }
  .lg-wordmark sup { position: absolute; top: 7px; right: -11px; font-size: 11px; }
  .lg-title { font-size: 28px; font-weight: 700; color: #111827; letter-spacing: -0.01em; }
  .lg-sub { font-size: 15px; color: #4b5563; margin-top: 8px; }
  .lg-ver {
    margin-top: 12px; padding: 2px 10px; border-radius: 999px;
    background: #f3f4f6; border: 1px solid #e5e7eb; color: #374151;
    font-family: ui-monospace, Consolas, "Courier New", monospace; font-size: 10.5px;
  }
  .lg-card {
    width: min(480px, 100%); background: #fff; border-radius: 16px;
    box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08), 0 1px 3px rgba(17, 24, 39, 0.05);
    padding: 34px 34px 30px;
  }
  .lg-tabs {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    background: #f3f4f6; border-radius: 11px; padding: 4px; margin-bottom: 28px;
  }
  .lg-tab {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    border: 0; background: transparent; border-radius: 8px; padding: 10px 4px;
    font: inherit; font-size: 14px; font-weight: 500; color: #6b7280; cursor: pointer;
  }
  .lg-tab svg { flex: 0 0 auto; }
  .lg-tab[aria-selected="true"] { background: #fff; color: var(--lg-blue); box-shadow: 0 1px 3px rgba(17, 24, 39, 0.12); }
  .lg-tab:focus-visible { outline: 2px solid var(--lg-blue); outline-offset: 1px; }
  .lg-h { font-size: 24px; font-weight: 700; color: #111827; }
  .lg-hsub { font-size: 14px; color: #4b5563; margin-top: 6px; }
  .lg-form { display: flex; flex-direction: column; margin-top: 30px; }
  .lg-label { font-size: 15px; font-weight: 500; color: #374151; margin-bottom: 9px; }
  .lg-input {
    height: 52px; width: 100%; padding: 0 18px;
    border: 1px solid #d1d5db; border-radius: 9px; background: #fff;
    font: inherit; font-size: 16px; color: #111827; outline: none; caret-color: var(--lg-blue);
  }
  .lg-input::placeholder { color: #9ca3af; }
  .lg-input:focus { border-color: var(--lg-blue); box-shadow: 0 0 0 3px rgba(65, 105, 225, 0.15); }
  .lg-gap { height: 20px; }
  .lg-btn {
    margin-top: 26px; height: 52px; border: 0; border-radius: 9px;
    background: var(--lg-blue); color: #fff; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .lg-btn:hover { background: #3558c9; }
  .lg-btn:active { transform: translateY(1px); }
  .lg-btn[disabled] { opacity: 0.6; cursor: default; }
  .lg-msg { margin-top: 12px; min-height: 18px; }
  .lg-foot { margin-top: 34px; font-size: 13px; color: #4b5563; text-align: center; }
  @media (max-width: 420px) {
    .lg-card { padding: 26px 20px 22px; }
    .lg-wordmark { font-size: 52px; }
    .lg-title { font-size: 25px; }
    .lg-tab { font-size: 13px; gap: 5px; }
  }

  /* ---------- App shell: top bar + left tree + content ---------- */
  #scr-app.active { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .topbar {
    flex: 0 0 auto; z-index: 30;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: #fff; border-bottom: 1px solid var(--border);
    padding: calc(9px + env(safe-area-inset-top)) var(--pad) 9px;
  }
  .topbar .left, .topbar .right { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .whoami { font-size: 11.5px; color: var(--muted); line-height: 1.3; text-align: right; }
  .whoami b { display: block; color: var(--ink); font-weight: 600; font-size: 13px; }
  .iconbtn {
    background: #fff; border: 1px solid var(--border); border-radius: 11px;
    width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text); flex: 0 0 auto;
  }
  .iconbtn:hover, .iconbtn:active { border-color: var(--brand); color: var(--brand); }
  .only-mobile { display: none !important; }

  .shell { flex: 1 1 auto; display: flex; min-height: 0; position: relative; }

  /* ---------- Left tree ---------- */
  .sidebar {
    flex: 0 0 264px; width: 264px; background: #fff; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  .side-head {
    align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--border);
  }
  .tree { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding: 12px 10px 16px; }
  .side-foot {
    flex: 0 0 auto; border-top: 1px solid var(--border);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase;
  }
  .tree button {
    display: flex; align-items: center; width: 100%;
    border: 0; background: transparent; font: inherit; color: var(--text);
    text-align: left; border-radius: 9px; cursor: pointer;
  }
  .tree button:hover { background: #f4f6fb; }
  .tree button:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
  .tree .ic { display: flex; flex: 0 0 auto; color: var(--muted); }
  .tree .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-home { gap: 10px; padding: 9px 10px; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .tree-parent {
    gap: 8px; padding: 9px 10px; margin-top: 2px;
    font-size: 11px !important; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase;
    color: var(--muted) !important;
  }
  .tree-parent .chev { display: flex; transition: transform 0.15s; }
  .tree-parent[aria-expanded="false"] .chev { transform: rotate(-90deg); }
  .tree-parent .count {
    margin-left: auto; padding: 1px 7px; border-radius: 999px;
    background: #f0f2f7; font-size: 10px; font-weight: 600; letter-spacing: 0;
  }
  .tree-children { margin: 1px 0 6px 16px; padding-left: 9px; border-left: 1px solid var(--border); }
  .tree-children[hidden] { display: none; }
  .tree-item { gap: 10px; padding: 8px 10px; font-size: 13.5px; }
  .tree [aria-current="page"] { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .tree [aria-current="page"] .ic { color: var(--brand); }
  .tree [aria-current="page"]:hover { background: var(--brand-soft); }

  /* ---------- Content ---------- */
  .content { flex: 1 1 auto; min-width: 0; overflow-y: auto; padding: 22px 28px calc(28px + env(safe-area-inset-bottom)); }
  .content-inner { max-width: 920px; }
  .crumb { font-size: 10.5px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
  .mod-title { font-family: var(--serif); font-size: 24px; font-weight: 700; color: var(--ink); line-height: 1.2; margin-top: 4px; }
  .mod-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
  #modBody { margin-top: 18px; }
  .placeholder {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 44px 20px; text-align: center;
  }
  .placeholder .ic {
    width: 48px; height: 48px; border-radius: 14px;
    background: var(--brand-soft); color: var(--brand);
    display: flex; align-items: center; justify-content: center;
  }
  .placeholder h3 { font-size: 15px; font-weight: 600; color: var(--ink); }
  .placeholder p { font-size: 13px; color: var(--muted); max-width: 340px; line-height: 1.55; }
  button.go.compact { width: auto; padding: 11px 20px; margin-top: 6px; font-size: 14px; }

  /* ---------- Master list (Unit) ---------- */
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 14px 16px; }
  .toolbar .search { flex: 1 1 200px; }
  .chk { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none;
         font-size: 12.5px; color: var(--muted); flex: 0 0 auto; }
  .chk input { accent-color: var(--brand); width: 15px; height: 15px; }
  .rows { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .row-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow); padding: 14px 16px;
    display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap;
  }
  .row-main { flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .row-code { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row-name { font-size: 15px; font-weight: 600; color: var(--ink); }
  .row-meta { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .row-acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
          padding: 4px 9px; border-radius: 999px; flex: 0 0 auto; }
  .pill.on { background: var(--brand-soft); color: var(--brand-deep); }
  .pill.off { background: #f0f0ef; color: #8a8a86; }
  .pill.geo { background: #eef7f1; color: #1c7a4b; }
  button.mini {
    background: #fff; border: 1px solid var(--border); color: var(--text);
    font: inherit; font-size: 12.5px; font-weight: 600; border-radius: 9px; padding: 7px 12px; cursor: pointer;
  }
  button.mini:hover { border-color: var(--brand); color: var(--brand); }
  button.mini.danger:hover { border-color: var(--error); color: var(--error); }
  .state { padding: 34px 20px; text-align: center; color: var(--muted); font-size: 13.5px; }

  /* ---------- Modal ---------- */
  .modal { position: fixed; inset: 0; z-index: 60; background: rgba(27, 32, 51, 0.42);
           display: flex; align-items: center; justify-content: center; padding: 18px; }
  .modal[hidden] { display: none; }
  .modal-card { width: min(560px, 100%); max-height: 92vh; overflow-y: auto;
                display: flex; flex-direction: column; gap: 16px; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .modal-head h3 { font-family: var(--serif); font-size: 19px; font-weight: 700; color: var(--ink); }
  .form-grid { display: flex; flex-direction: column; gap: 13px; }
  .form-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
  .form-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; }
  .time-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .sec-note { font-size: 12px; color: var(--muted); line-height: 1.45; }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .card-head .ic {
    width: 34px; height: 34px; border-radius: 10px; flex: 0 0 auto;
    background: var(--brand-soft); color: var(--brand);
    display: flex; align-items: center; justify-content: center;
  }
  .card-head h3 { font-size: 15px; font-weight: 600; color: var(--ink); }
  .set-card { display: flex; flex-direction: column; gap: 13px; margin-bottom: 14px; }
  .banner {
    border: 1px solid #f0dcc2; background: #fdf7ee; color: #7a5a22;
    border-radius: 12px; padding: 13px 15px; font-size: 13px; line-height: 1.5; margin-bottom: 14px;
  }
  .banner b { color: #5d4416; }
  .saved-tag { font-size: 11.5px; color: var(--ok); font-weight: 600; }
  .wa-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .wa-card { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: #fff; }
  .wa-card-head { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .wa-card-head b { display: block; font-size: 13.5px; color: var(--ink); }
  .wa-card-head span { font-size: 11.5px; color: var(--muted); }
  .wa-stage { background: #efeae2; padding: 14px 12px; }
  .wa-bubble { background: #e1f5c8; border-radius: 10px; overflow: hidden; max-width: 260px; margin-left: auto;
               box-shadow: 0 1px 1px rgba(0,0,0,.08); font-size: 13px; color: #111; }
  .wa-img { height: 96px; background: #e6e9ee; display: flex; align-items: center; justify-content: center; color: #9aa1ab; }
  .wa-text { padding: 8px 10px; white-space: pre-wrap; line-height: 1.45; }
  .wa-var { background: #fff3c4; border-radius: 4px; padding: 0 3px; font-weight: 600; }
  .wa-btn { border-top: 1px solid #c9dcb4; padding: 8px 10px; text-align: center; color: #2f6fd0; font-weight: 600; }
  .wa-meta { padding: 9px 12px; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
  .wa-tools { padding: 10px 12px 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 9px; }
  .wa-tools .txt { padding: 9px 11px; font-size: 13.5px; }
  .wa-tools .field label { font-size: 10px; }
  .wa-vars { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .wa-log { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .wa-log th, .wa-log td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .wa-log th { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .wa-ok { color: var(--ok); font-weight: 600; }
  .sms-bubble { background: #f1f3f7; border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.45; color: #111; }
  .sms-var { background: #fff3c4; border-radius: 4px; padding: 0 3px; font-weight: 600; }
  .wa-bad { color: var(--error); font-weight: 600; }

  /* ---------- Permission matrix ---------- */
  .matrix-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 14px; background: #fff; }
  table.matrix { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-size: 13px; }
  table.matrix th, table.matrix td { padding: 9px 10px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  table.matrix thead th {
    position: sticky; top: 0; z-index: 3; background: #f7f8fc;
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
  }
  table.matrix th.page-col, table.matrix td.page-col {
    position: sticky; left: 0; z-index: 2; background: #fff;
    min-width: 190px; white-space: normal; font-weight: 600; color: var(--ink);
  }
  table.matrix thead th.page-col { z-index: 4; background: #f7f8fc; }
  table.matrix tr.group-row td {
    background: #f7f8fc; font-size: 10.5px; font-weight: 700;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted);
    position: sticky; left: 0;
  }
  table.matrix select.cell {
    width: 100%; min-width: 132px; font: inherit; font-size: 12.5px; padding: 6px 8px;
    border: 1px solid var(--border); border-radius: 8px; background: #fbfcfe; color: var(--text); cursor: pointer;
  }
  table.matrix select.cell:focus { outline: none; border-color: var(--brand); }
  select.cell[data-level="none"] { color: var(--muted); }
  select.cell[data-level="view_own"], select.cell[data-level="view_all"] { background: #eef7f1; border-color: #cfe6d9; }
  select.cell[data-level="edit_own"], select.cell[data-level="edit_all"] { background: #fdf7ee; border-color: #f0dcc2; }
  select.cell.dirty { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(47, 75, 208, 0.12); }
  .locked-col { text-align: center !important; color: var(--ok); }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .filters select.txt { width: auto; min-width: 128px; padding: 8px 10px; font-size: 12.5px; }
  .result-count { font-size: 12px; color: var(--muted); margin-left: auto; white-space: nowrap; }
  table.matrix td.nm { font-weight: 600; color: var(--ink); }
  .role-tag {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    background: var(--brand-soft); color: var(--brand-deep);
    font-size: 11px; font-weight: 600; text-transform: lowercase;
  }
  .role-tag.admin { background: #ede9fb; color: #5b3fc4; }
  .role-tag.superadmin { background: #fdecea; color: #a3372c; }
  .role-tag.manager { background: #eaf3fd; color: #2a5d99; }
  .act-btn {
    background: #fff; border: 1px solid var(--border); border-radius: 8px;
    width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--muted); margin-right: 5px;
  }
  .act-btn:hover { border-color: var(--brand); color: var(--brand); }
  .legend { font-size: 12px; color: var(--muted); line-height: 1.7; padding: 12px 2px 0; }
  .legend b { color: var(--ink); font-weight: 600; }
  .legend .key { color: var(--ink); font-weight: 600; }
  .sec-note b { color: var(--ink); font-weight: 600; }
  .count-badge {
    display: inline-flex; align-items: center; gap: 4px; margin-left: 8px;
    padding: 2px 8px; border-radius: 999px; background: #f0f2f7; color: var(--muted);
    font-size: 11px; font-weight: 600; vertical-align: middle;
  }
  @media (max-width: 560px) {
    .form-2, .form-3 { grid-template-columns: 1fr; }
  }
  textarea.txt { resize: vertical; min-height: 64px; font-family: inherit; }
  .modal-acts { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .sec {
    border-top: 1px solid var(--border); padding-top: 14px; margin-top: 2px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .radio-row { display: flex; gap: 18px; flex-wrap: wrap; }
  .radio-row label { display: flex; align-items: center; gap: 7px; cursor: pointer; font-size: 14px; }
  .radio-row input { accent-color: var(--brand); width: 16px; height: 16px; }
  .map-box { height: 300px; border: 1px solid var(--border); border-radius: 11px; overflow: hidden; background: #eef0f6; position: relative; }
  .map-off { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
             gap: 8px; text-align: center; padding: 20px; color: var(--muted); font-size: 13px; background: #fdf6f4; }
  .map-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.45; }
  .hint b { color: var(--ink); font-weight: 600; }

  .scrim { display: none; }

  /* ---------- Phones and small tablets: the tree becomes a slide-in drawer ---------- */
  @media (max-width: 899px) {
    .only-mobile { display: flex !important; }
    .sidebar {
      position: fixed; z-index: 40; top: 0; bottom: 0; left: 0;
      width: min(292px, 84vw); padding-top: env(safe-area-inset-top);
      box-shadow: 0 0 40px rgba(27, 32, 51, 0.18);
      transform: translateX(-100%); visibility: hidden;
      transition: transform 0.2s ease, visibility 0s linear 0.2s;
    }
    .shell.drawer-open .sidebar { transform: none; visibility: visible; transition: transform 0.2s ease; }
    .scrim {
      display: block; position: fixed; inset: 0; z-index: 35;
      background: rgba(27, 32, 51, 0.35); opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .shell.drawer-open .scrim { opacity: 1; pointer-events: auto; }
    .content { padding: 16px var(--pad) calc(24px + env(safe-area-inset-bottom)); }
    .mod-title { font-size: 21px; }
    .tree-item { padding: 10px 10px; font-size: 14.5px; }   /* bigger touch targets */
  }
</style>
</head>
<body>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var CFG = window.APP_CFG;

  // ---------- Supabase (data lives in the `team2` schema) ----------
  var sb = window.supabase.createClient(CFG.url, CFG.key, {
    db: { schema: "team2" },
    auth: { persistSession: true, autoRefreshToken: true, storageKey: "team2.auth" }
  });
  var emailOf = function (u) { return u.toLowerCase() + "@team2.app"; };

  var me = null;        // signed-in profile row
  var SETTINGS = {};    // team2.app_settings, readable by every signed-in user
  var myAccess = {};    // menu_id -> access level, from the permission matrix

  // ---------- Icons (24x24, stroked) ----------
  var ICONS = {
    home:     "M4.5 10.6 12 4.4l7.5 6.2V19a1 1 0 0 1-1 1h-4.3v-5.4H9.8V20H5.5a1 1 0 0 1-1-1z",
    clock:    "M12 20.4a8.4 8.4 0 1 0 0-16.8 8.4 8.4 0 0 0 0 16.8zM12 7.4V12l3 1.8",
    calendar: "M5 6.4h14v13H5zM5 10.2h14M8.6 4.4v3M15.4 4.4v3M8.6 13.4h1.4M15 13.4h.02M8.6 16.4h1.4M15 16.4h.02",
    pin:      "M12 20.5s6.2-5.4 6.2-9.6a6.2 6.2 0 1 0-12.4 0c0 4.2 6.2 9.6 6.2 9.6zM12 13a2.6 2.6 0 1 0 0-5.2 2.6 2.6 0 0 0 0 5.2z",
    route:    "M6.8 20.4a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4zM17.2 8a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4zM17.2 8.2v3a3.4 3.4 0 0 1-3.4 3.4h-3.6a3.4 3.4 0 0 0-3.4 3.4v.2",
    bag:      "M4.6 8.4h14.8v10.6H4.6zM9 8.4V6.2a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2.2M4.6 12.6h14.8",
    hourglass:"M7.4 4.4h9.2M7.4 19.6h9.2M8.4 4.4v3.2L12 11l3.6-3.4V4.4M8.4 19.6v-3.2L12 13l3.6 3.4v3.2",
    edit:     "M4.6 19.4h4l9.4-9.4a1.8 1.8 0 0 0 0-2.6l-1.4-1.4a1.8 1.8 0 0 0-2.6 0L4.6 15.4zM13.8 7.2l3 3",
    check:    "M12 20.4a8.4 8.4 0 1 0 0-16.8 8.4 8.4 0 0 0 0 16.8zM8.2 12.2l2.6 2.6 5-5.2",
    building: "M4.6 20h14.8M6.4 20V5.2a1 1 0 0 1 1-1h5.2a1 1 0 0 1 1 1V20M13.6 9.6h4a1 1 0 0 1 1 1V20M9 8h1.6M9 11.4h1.6M9 14.8h1.6M15.8 13h1M15.8 16.4h1",
    tag:      "M4.8 11.6V5.6a.8.8 0 0 1 .8-.8h6a.8.8 0 0 1 .57.23l6.9 6.9a.8.8 0 0 1 0 1.14l-5.9 5.9a.8.8 0 0 1-1.14 0l-6.9-6.9a.8.8 0 0 1-.23-.57zM8.4 8.6h.02",
    map:      "M4.6 6.6l4.8-2 5.2 2 4.8-2v12.8l-4.8 2-5.2-2-4.8 2zM9.4 4.6v12.8M14.6 6.6v12.8",
    grid:     "M4.5 4.5h5.5v5.5H4.5zM14 4.5h5.5v5.5H14zM4.5 14h5.5v5.5H4.5zM14 14h5.5v5.5H14z",
    badge:    "M5.6 4.8h12.8a1 1 0 0 1 1 1v12.4a1 1 0 0 1-1 1H5.6a1 1 0 0 1-1-1V5.8a1 1 0 0 1 1-1zM9.6 4.8V3.6h4.8v1.2M12 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM8.7 16.6a3.4 3.4 0 0 1 6.6 0",
    star:     "M12 4.2l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 9.9l5.4-.8z",
    list:     "M8 7.4h11M8 12h11M8 16.6h11M4.9 7.4h.02M4.9 12h.02M4.9 16.6h.02",
    key:      "M10.6 13.4a4.4 4.4 0 1 1 3.2 1.3M10.6 13.4L5.2 18.8v1.6h2.6v-1.8h1.8v-1.8h1.6l1.2-1.2M15.6 8.4h.02",
    chart:    "M4.5 19.5h15M7.6 19.5v-5.4M12 19.5V8.6M16.4 19.5v-8.2",
    car:      "M4.8 15.2h14.4M6.4 15.2l1.5-4.7a1.4 1.4 0 0 1 1.33-.98h5.54a1.4 1.4 0 0 1 1.33.98l1.5 4.7M6.4 15.2v2.6M17.6 15.2v2.6M8.4 18.4h.02M15.6 18.4h.02",
    users:    "M9.4 11.6a3.4 3.4 0 1 0 0-6.8 3.4 3.4 0 0 0 0 6.8zM3.4 19.4a6 6 0 0 1 12 0M16.2 5.2a3.4 3.4 0 0 1 0 6.6M17.6 13.9a6 6 0 0 1 3.2 5.5",
    sliders:  "M4.6 7.6h8.8M17.4 7.6h2M4.6 16.4h2.2M11 16.4h8.4M15.4 5.6v4M8.8 14.4v4",
    cog:      "M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.1 13.4l1.9 1.4-1.6 2.8-2.2-.9a7 7 0 0 1-1.9 1.1l-.3 2.4h-3.2l-.3-2.4a7 7 0 0 1-1.9-1.1l-2.2.9L5.8 14.8l1.9-1.4a7 7 0 0 1 0-2.2L5.8 9.8l1.6-2.8 2.2.9a7 7 0 0 1 1.9-1.1l.3-2.4h3.2l.3 2.4a7 7 0 0 1 1.9 1.1l2.2-.9 1.6 2.8-1.9 1.4a7 7 0 0 1 0 2.4z"
  };

  function svg(name, size) {
    var d = ICONS[name] || ICONS.grid;
    return '<svg width="' + (size || 19) + '" height="' + (size || 19) + '" viewBox="0 0 24 24" ' +
           'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" ' +
           'stroke-linejoin="round"><path d="' + d + '"/></svg>';
  }

  // ---------- The menus ----------
  // Every one is an empty screen until its behaviour is specified.
  // For masters, `id` is the table name so the permission matrix keys on one value.
  // `roles` limits who sees the tile; leave it out for "everyone".
  var MENUS = [
    { group: "Daily", id: "punch",         label: "Punch In / Out",  desc: "Mark attendance with GPS",     icon: "clock" },
    { group: "Daily", id: "attendance",    label: "My Attendance",   desc: "Day-wise register",            icon: "calendar" },
    { group: "Daily", id: "visits",        label: "Visits",          desc: "Plan, check in, check out",    icon: "pin" },
    { group: "Daily", id: "visit_tracks",  label: "Live Tracking",   desc: "Where the team is today",      icon: "route" },

    { group: "Requests", id: "leave_requests",      label: "Leave",          desc: "Apply and track leave",   icon: "bag" },
    { group: "Requests", id: "permission_requests", label: "Permission",     desc: "Short leave in hours",    icon: "hourglass" },
    { group: "Requests", id: "regularisations",     label: "Regularisation", desc: "Fix a missed punch",      icon: "edit" },
    { group: "Requests", id: "approvals",           label: "Approvals",      desc: "Act on your team's requests", icon: "check",
      roles: ["superadmin", "admin", "manager"] },

    { group: "Masters", id: "parties",         label: "Customer / Site", desc: "Who the team visits",    icon: "building" },
    { group: "Masters", id: "visit_purposes",  label: "Visit Purpose",   desc: "Reasons for a visit",    icon: "tag" },
    { group: "Masters", id: "locations",       label: "Unit",            desc: "Units, addresses &amp; geofences", icon: "map",
      render: function (h) { renderUnits(h); } },
    { group: "Masters", id: "departments",     label: "Department",      desc: "Departments",            icon: "grid",
      render: function (h) { simpleMaster(h, DEPARTMENTS_M); } },
    { group: "Masters", id: "designations",    label: "Designation",     desc: "Job titles",             icon: "badge",
      render: function (h) { simpleMaster(h, DESIGNATIONS_M); } },
    { group: "Masters", id: "shifts",          label: "Schedule",        desc: "Timings, breaks &amp; permission", icon: "clock",
      render: function (h) { renderSchedules(h); } },
    { group: "Masters", id: "holidays",        label: "Holiday",         desc: "Holiday calendar",       icon: "star" },
    { group: "Masters", id: "leave_types",     label: "Leave Type",      desc: "Quotas &amp; rules",         icon: "list" },
    { group: "Masters", id: "roles",           label: "Role",            desc: "Roles &amp; their rights",   icon: "key",
      render: function (h) { simpleMaster(h, ROLES_M); } },

    { group: "Reports", id: "reports", label: "Reports",           desc: "Attendance, leave, visits", icon: "chart" },
    { group: "Reports", id: "trips",   label: "Travel / Distance", desc: "Km travelled &amp; claims",     icon: "car" },

    { group: "Admin", id: "users",       label: "User Master", desc: "Staff, logins &amp; reporting line", icon: "users",
      roles: ["superadmin", "admin"],
      render: function (h) { renderUsers(h); } },
    { group: "Admin", id: "permissions", label: "Permissions", desc: "What each role can do",   icon: "sliders",
      roles: ["superadmin", "admin"],
      render: function (h) { renderPermissions(h); } },
    { group: "Admin", id: "settings",    label: "Settings",    desc: "Integrations &amp; keys",     icon: "cog",
      roles: ["superadmin", "admin"],
      render: function (h) { renderSettings(h); } }
  ];

  var GROUP_ORDER = ["Daily", "Requests", "Masters", "Reports", "Admin"];

  var MENU_BY_ID = {};
  MENUS.forEach(function (m) { MENU_BY_ID[m.id] = m; });

  // ---------- Screens ----------
  function show(id) {
    ["scr-login", "scr-app"].forEach(function (s) {
      $(s).classList.toggle("active", s === id);
    });
    window.scrollTo(0, 0);
  }

  function setMsg(el, text, ok) {
    el.textContent = text || "";
    el.classList.toggle("err", !!text && !ok);
    el.classList.toggle("ok", !!text && !!ok);
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // ---------- Permission matrix, as it applies to the signed-in user ----------
  // Mirrors team2.can_view / can_edit in the database. The database is what
  // actually protects the data; this only decides which tiles are shown.
  // app_settings is readable by everyone signed in — never put a secret in it.
  async function loadAppSettings() {
    SETTINGS = {};
    var r = await sb.from("app_settings").select("key, value");
    if (r.error || !r.data) return;
    r.data.forEach(function (row) { SETTINGS[row.key] = row.value; });
  }

  async function loadMyAccess() {
    myAccess = {};
    if (!me || !me.role_id) return;
    var r = await sb.from("role_permissions").select("menu_id, access").eq("role_id", me.role_id);
    if (r.error || !r.data) return;
    r.data.forEach(function (row) { myAccess[row.menu_id] = row.access; });
  }

  function menuVisible(m) {
    if (m.roles && m.roles.indexOf(me.role) === -1) return false;
    if (me.role === "superadmin" || me.role === "admin") return true;
    var a = myAccess[m.id];
    if (a === undefined) return true;    // matrix says nothing — stay visible
    return a !== "none";
  }

  // ---------- Left tree menu ----------
  // Groups are branches, menus are leaves. Which branches are collapsed is
  // remembered per browser; opening a menu always expands its branch.
  var currentId = null;   // null = Home
  var treeCollapsed = {};
  try { treeCollapsed = JSON.parse(localStorage.getItem("team2.treeCollapsed") || "{}") || {}; }
  catch (e) { treeCollapsed = {}; }

  var CHEVRON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
                'stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';

  // Menu labels carry HTML entities (&amp;); a title attribute needs plain text.
  function plain(html) {
    var t = document.createElement("textarea");
    t.innerHTML = html;
    return t.value;
  }

  function groupKey(g) { return "tg-" + g.toLowerCase(); }

  function renderTree() {
    var host = $("treeHost");
    host.innerHTML = "";

    var home = document.createElement("button");
    home.type = "button";
    home.className = "tree-home";
    home.dataset.id = "";
    home.innerHTML = '<span class="ic">' + svg("home", 18) + '</span><span class="lbl">Home</span>';
    home.addEventListener("click", goHome);
    host.appendChild(home);

    var mine = MENUS.filter(menuVisible);
    GROUP_ORDER.forEach(function (g) {
      var items = mine.filter(function (m) { return m.group === g; });
      if (!items.length) return;
      var open = !treeCollapsed[g];

      var wrap = document.createElement("div");
      wrap.className = "tree-group";

      var parent = document.createElement("button");
      parent.type = "button";
      parent.className = "tree-parent";
      parent.setAttribute("aria-expanded", open ? "true" : "false");
      parent.setAttribute("aria-controls", groupKey(g));
      parent.innerHTML = '<span class="chev">' + CHEVRON + '</span><span class="lbl">' + g + '</span>' +
                         '<span class="count">' + items.length + '</span>';

      var list = document.createElement("div");
      list.className = "tree-children";
      list.id = groupKey(g);
      list.hidden = !open;
      parent.addEventListener("click", function () { setGroupOpen(g, list.hidden); });

  // ---------- CSV helpers ----------
  function csvCell(v) {
    var t = v == null ? "" : String(v);
    return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  }

  function toCsv(rows) {
    return rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n");
  }

  // Handles quoted fields, embedded commas/newlines and doubled quotes.
  function parseCsv(text) {
    var rows = [], row = [], cell = "", q = false, i;
    text = text.replace(/^\uFEFF/, "");               // strip BOM
    for (i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) {
        if (c === '"') {
          if (text[i + 1] === '"') { cell += '"'; i++; } else q = false;
        } else cell += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
      else if (c !== "\r") cell += c;
    }
    if (cell.length || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (x) { return String(x).trim() !== ""; }); });
  }

  function download(filename, text) {
    var blob = new Blob([text], { type: "text/csv;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  function today() { return new Date().toISOString().slice(0, 10); }

  function truthy(v) {
    var t = String(v == null ? "" : v).trim().toLowerCase();
    return !(t === "no" || t === "false" || t === "0" || t === "n" || t === "inactive");
  }

    if (!err) return "Could not save";
    if (err.code === "42501" || /row-level security/i.test(err.message || "")) {
      return "You do not have rights to change this";

    if (err.code === "23505") return "That code or name already exists";
    return err.message || "Could not save";
  }

          '</div>' +
          '<div id="sm-preview"></div>' +
          '<div class="msg" id="sm-imsg"></div>' +
          '<div class="modal-acts">' +
            '<button class="mini" id="sm-icancel" type="button">Cancel</button>' +
            '<button class="go compact" id="sm-igo" type="button" disabled>Import</button>' +
          '</div>' +
        '</div>');

      var pending = [];
      $("sm-icancel").addEventListener("click", closeModal);
      $("sm-tpl").addEventListener("click", function () {
        var extras = (cfg.extra || []).map(function (f) { return f.k; });
        var tpl = [["name"].concat(extras, ["active"])].concat(cfg.sample.map(function (n) {
          return [n].concat(extras.map(function () { return ""; }), ["yes"]);
        }));
        download(cfg.table + "-import-template.csv", toCsv(tpl));
      });

      $("sm-file").addEventListener("change", function () {
        var f = this.files && this.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onload = function () {
          var grid = parseCsv(String(reader.result));
          if (!grid.length) { setMsg($("sm-imsg"), "That file is empty"); return; }
          var head = grid[0].map(function (h) { return h.trim().toLowerCase(); });
          var iName = head.indexOf("name");
          var iActive = head.indexOf("active");
          if (iName === -1) { setMsg($("sm-imsg"), 'No "name" column in that file'); return; }

          var seen = {}, dup = 0, blank = 0;
          var existing = {};
          rows.forEach(function (r) { existing[r.name.toLowerCase()] = true; });
          pending = [];
          grid.slice(1).forEach(function (r) {
            var name = (r[iName] || "").trim();
            if (!name) { blank++; return; }
            var key = name.toLowerCase();
            if (existing[key] || seen[key]) { dup++; return; }
            seen[key] = true;
            var rec = { name: name, active: iActive === -1 ? true : truthy(r[iActive]), created_by: me.id };
            (cfg.extra || []).forEach(function (f) {
              var ix = head.indexOf(f.k);
              if (ix === -1) return;
              var raw = (r[ix] || "").trim();
              if (f.type === "checkbox") rec[f.k] = raw ? truthy(raw) : false;
              else if (raw) rec[f.k] = raw;
            });
            pending.push(rec);
          });

          $("sm-preview").innerHTML = '<div class="panel state" style="padding:14px">' +
            '<b>' + pending.length + '</b> to import' +
            (dup ? ' · ' + dup + ' skipped (already exist or repeated)' : '') +
            (blank ? ' · ' + blank + ' blank rows ignored' : '') +
            (pending.length ? '<br><span class="hint">' +
              esc(pending.slice(0, 5).map(function (x) { return x.name; }).join(", ")) +
              (pending.length > 5 ? ", …" : "") + '</span>' : '') +
            '</div>';
          setMsg($("sm-imsg"), "");
          $("sm-igo").disabled = pending.length === 0;
        };
        reader.readAsText(f);
      });

      $("sm-igo").addEventListener("click", async function () {
        if (!pending.length) return;
        $("sm-igo").disabled = true;
        setMsg($("sm-imsg"), "Importing " + pending.length + "…", true);
        var r = await sb.from(cfg.table).insert(pending);
        if (r.error) { $("sm-igo").disabled = false; setMsg($("sm-imsg"), saveError(r.error)); return; }
        closeModal();
        load();
      });
    }

    load();
  }

  // ---------- User master ----------
  // Creating a login needs the service-role key, which cannot live in a browser,
  // so adds and password resets go through the `team2-admin` edge function.

  var LOGIN_ROLES = ["staff", "manager", "admin", "superadmin"];

  function adminCall(payload) { return fnCall("team2-admin", payload); }

  async function fnCall(fn, payload) {
    var ses = await sb.auth.getSession();
    var token = ses.data.session && ses.data.session.access_token;
    if (!token) return { error: "Your session expired — sign in again" };
    try {
      var res = await fetch(CFG.url + "/functions/v1/" + fn, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify(payload)
      });
      var body = await res.json().catch(function () { return {}; });
      if (!res.ok) return { error: body.error || ("Request failed (" + res.status + ")") };
      return body;
    } catch (e) {
      return { error: "Could not reach the server — check your connection" };
    }
  }

        ["Name", "Staff ID", "Mobile", "Role", "Department", "Designation",
         "Report 1", "Report 2", "Report 3", "Unit", "Schedule", "Status", "Actions"]
          .map(function (h, i) { return '<th' + (i === 0 ? ' class="page-col"' : '') + '>' + h + '</th>'; }).join("") +
        '</tr></thead>';

      var body = list.map(function (u) {
        return '<tr>' +
          '<td class="page-col nm">' + esc(u.name) + '</td>' +
          '<td>' + esc(u.emp_code || "–") + '</td>' +
          '<td>' + esc(u.username) + '</td>' +
          '<td><span class="role-tag ' + esc(u.role) + '">' + esc(u.role) + '</span></td>' +
          '<td>' + esc(nameOf("departments", u.department_id) || "–") + '</td>' +
          '<td>' + esc(nameOf("designations", u.designation_id) || "–") + '</td>' +
          '<td>' + esc(staffName(u.reporting_to) || "–") + '</td>' +
          '<td>' + esc(staffName(u.reporting_to_2) || "–") + '</td>' +
          '<td>' + esc(staffName(u.reporting_to_3) || "–") + '</td>' +
          '<td>' + esc(nameOf("locations", u.location_id) || "–") + '</td>' +
          '<td>' + esc(nameOf("shifts", u.shift_id) || "–") + '</td>' +
          '<td><span class="pill ' + (u.active ? "on" : "off") + '">' + (u.active ? "Active" : "Inactive") + '</span></td>' +
          '<td style="white-space:nowrap">' +
            '<button class="act-btn" data-edit="' + u.id + '" title="Edit" type="button">' + svg("edit", 14) + '</button>' +
            '<button class="act-btn" data-pw="' + u.id + '" title="Set password" type="button">' + svg("key", 14) + '</button>' +
            '<button class="act-btn" data-toggle="' + u.id + '" title="' +
              (u.active ? "Deactivate" : "Activate") + '" type="button">' + svg("check", 14) + '</button>' +
          '</td></tr>';
      }).join("");

      host2.innerHTML = '<div class="matrix-wrap"><table class="matrix">' + head + '<tbody>' + body + '</tbody></table></div>' +
        '<div class="legend">A login is the <b>mobile number</b>. Staff are never deleted — ' +
        'switch them to <b>Inactive</b> instead, so their attendance, leave and visit history stays intact.</div>';

      host2.querySelectorAll("[data-edit]").forEach(function (b) {
        b.addEventListener("click", function () { form(byId[b.dataset.edit]); });
      });
      host2.querySelectorAll("[data-pw]").forEach(function (b) {
        b.addEventListener("click", function () { passwordForm(byId[b.dataset.pw]); });
      });
      host2.querySelectorAll("[data-toggle]").forEach(function (b) {
        b.addEventListener("click", function () { toggleActive(byId[b.dataset.toggle]); });
      });

    function fillFilter(id, rows) {
      var sel = $(id);
      rows.forEach(function (r) {
        var o = document.createElement("option");
        o.value = r.id; o.textContent = r.name;
        sel.appendChild(o);
      });
    }

    async function load() {
      var res = await Promise.all([
        sb.from("profiles").select("*").order("name"),
        sb.from("departments").select("id, name, active").order("name"),
        sb.from("designations").select("id, name, active").order("name"),
        sb.from("locations").select("id, name, active").order("name"),
        sb.from("shifts").select("id, name, active").order("name"),
        sb.from("roles").select("id, name, active").order("name")
      ]);
      if (res[0].error) {
        $("us-host").innerHTML = '<div class="panel state">Could not load staff — ' + esc(res[0].error.message) + '</div>';
        return;
      }
      staff = res[0].data || [];
      byId = {};
      staff.forEach(function (u) { byId[u.id] = u; });
      lists.departments = res[1].data || [];
      lists.designations = res[2].data || [];
      lists.locations = res[3].data || [];
      lists.shifts = res[4].data || [];
      lists.roles = res[5].data || [];

      if (!$("us-f-role").dataset.filled) {
        LOGIN_ROLES.forEach(function (r) {
          var o = document.createElement("option");
          o.value = r; o.textContent = r;
          $("us-f-role").appendChild(o);
        });
        fillFilter("us-f-department", lists.departments);
        fillFilter("us-f-designation", lists.designations);
        fillFilter("us-f-shift", lists.shifts);
        fillFilter("us-f-location", lists.locations);
        $("us-f-role").dataset.filled = "1";
      }
      paint();
    }

    function opts(rows, selected, blank) {
      return '<option value="">' + (blank || "—") + '</option>' +
        rows.map(function (r) {
          return '<option value="' + r.id + '"' + (r.id === selected ? " selected" : "") + '>' + esc(r.name) + '</option>';
        }).join("");
    }

    async function toggleActive(u) {
      if (!u) return;
      var to = !u.active;
      if (!window.confirm((to ? "Activate " : "Deactivate ") + u.name + "?")) return;
      var r = await sb.from("profiles").update({ active: to }).eq("id", u.id);
      if (r.error) { setMsg($("us-msg"), saveError(r.error)); return; }
      setMsg($("us-msg"), u.name + (to ? " activated" : " deactivated"), true);
      load();
    }

    function passwordForm(u) {
      if (!u) return;
      openModal("Set password — " + u.name,
        '<div class="form-grid">' +
          '<p class="hint">Sets a new password for <b>' + esc(u.username) + '</b>. ' +
            'Tell them out of band; it is not stored anywhere you can read it back.</p>' +
          '<div class="field"><label for="pw-new">New password</label>' +
            '<input class="txt" id="pw-new" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div>' +
          '<div class="msg" id="pw-msg"></div>' +
          '<div class="modal-acts">' +
            '<button class="mini" id="pw-cancel" type="button">Cancel</button>' +
            '<button class="go compact" id="pw-save" type="button">Set password</button>' +
          '</div>' +
        '</div>');
      $("pw-cancel").addEventListener("click", closeModal);
      $("pw-save").addEventListener("click", async function () {
        var v = $("pw-new").value;
        if (v.length < 6) { setMsg($("pw-msg"), "At least 6 characters"); return; }
        $("pw-save").disabled = true;
        setMsg($("pw-msg"), "Saving…", true);
        var r = await adminCall({ action: "set_password", user_id: u.id, password: v });
        $("pw-save").disabled = false;
        if (r.error) { setMsg($("pw-msg"), r.error); return; }
        closeModal();
        setMsg($("us-msg"), "Password updated for " + u.name, true);
      });
    }

    function form(u) {
      var others = staff.filter(function (x) { return !u || x.id !== u.id; });
      openModal(u ? "Edit staff — " + u.name : "Add staff",
        '<div class="form-grid">' +
          '<div class="form-2">' +
            '<div class="field"><label for="us-name">Name *</label>' +
              '<input class="txt" id="us-name" type="text" autocomplete="off"></div>' +
            '<div class="field"><label for="us-mobile">Mobile (this is the login) *</label>' +
              '<input class="txt" id="us-mobile" type="tel" inputmode="numeric" maxlength="10" autocomplete="off"' +
              (u ? " disabled" : "") + '></div>' +
          '</div>' +
          (u ? '' :
            '<div class="field"><label for="us-pass">Password *</label>' +
              '<input class="txt" id="us-pass" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div>') +
          '<div class="form-2">' +
            '<div class="field"><label for="us-emp">Staff ID</label><input class="txt" id="us-emp" type="text" autocomplete="off"></div>' +
            '<div class="field"><label for="us-email">Email</label><input class="txt" id="us-email" type="email" autocomplete="off"></div>' +
          '</div>' +
          '<div class="form-2">' +
            '<div class="field"><label for="us-role">Login role *</label><select class="txt" id="us-role">' +
              LOGIN_ROLES.map(function (r) { return '<option value="' + r + '">' + r + '</option>'; }).join("") +
              '</select></div>' +
            '<div class="field"><label for="us-roleid">Permission role</label>' +
              '<select class="txt" id="us-roleid">' + opts(lists.roles, u && u.role_id) + '</select></div>' +
          '</div>' +
          '<div class="form-2">' +
            '<div class="field"><label for="us-dep">Department</label>' +
              '<select class="txt" id="us-dep">' + opts(lists.departments, u && u.department_id) + '</select></div>' +
            '<div class="field"><label for="us-des">Designation</label>' +
              '<select class="txt" id="us-des">' + opts(lists.designations, u && u.designation_id) + '</select></div>' +
          '</div>' +
          '<div class="form-2">' +
            '<div class="field"><label for="us-loc">Unit</label>' +
              '<select class="txt" id="us-loc">' + opts(lists.locations, u && u.location_id) + '</select></div>' +
            '<div class="field"><label for="us-shift">Schedule</label>' +
              '<select class="txt" id="us-shift">' + opts(lists.shifts, u && u.shift_id) + '</select></div>' +
          '</div>' +
          '<div class="sec">' +
            '<span class="sec-title">Reporting</span>' +
            '<div class="form-3">' +
              '<div class="field"><label for="us-r1">Report 1</label>' +
                '<select class="txt" id="us-r1">' + opts(others, u && u.reporting_to) + '</select></div>' +
              '<div class="field"><label for="us-r2">Report 2</label>' +
                '<select class="txt" id="us-r2">' + opts(others, u && u.reporting_to_2) + '</select></div>' +
              '<div class="field"><label for="us-r3">Report 3</label>' +
                '<select class="txt" id="us-r3">' + opts(others, u && u.reporting_to_3) + '</select></div>' +
            '</div>' +
            '<span class="sec-note">Only <b>Report 1</b> decides what a manager can see — it is the ' +
              'chain the database walks. Reports 2 and 3 are escalation contacts.</span>' +
          '</div>' +
          '<label class="chk"><input type="checkbox" id="us-active" checked> Active</label>' +
          '<div class="msg" id="us-fmsg"></div>' +
          '<div class="modal-acts">' +
            '<button class="mini" id="us-cancel" type="button">Cancel</button>' +
            '<button class="go compact" id="us-save" type="button">' + (u ? "Save changes" : "Create staff") + '</button>' +
          '</div>' +
        '</div>');

      $("us-name").value = u ? u.name : "";
      $("us-mobile").value = u ? u.username : "";
      $("us-emp").value = u && u.emp_code ? u.emp_code : "";
      $("us-email").value = u && u.email ? u.email : "";
      $("us-role").value = u ? u.role : "staff";
      $("us-active").checked = u ? !!u.active : true;
      if (!u) {
        $("us-mobile").addEventListener("input", function () {
          this.value = this.value.replace(/\D/g, "").slice(0, 10);
        });
      }
      $("us-cancel").addEventListener("click", closeModal);

      $("us-save").addEventListener("click", async function () {
        var msg = $("us-fmsg");
        var name = $("us-name").value.trim();
        if (!name) { setMsg(msg, "Enter the name"); return; }

        var profile = {
          name: name,
          role: $("us-role").value,
          emp_code: $("us-emp").value.trim() || null,
          email: $("us-email").value.trim() || null,
          role_id: $("us-roleid").value || null,
          department_id: $("us-dep").value || null,
          designation_id: $("us-des").value || null,
          location_id: $("us-loc").value || null,
          shift_id: $("us-shift").value || null,
          reporting_to: $("us-r1").value || null,
          reporting_to_2: $("us-r2").value || null,
          reporting_to_3: $("us-r3").value || null,
          active: $("us-active").checked
        };

        $("us-save").disabled = true;
        setMsg(msg, "Saving…", true);
        var r;
        if (u) {
          r = await sb.from("profiles").update(profile).eq("id", u.id);
          if (r.error) { $("us-save").disabled = false; setMsg(msg, saveError(r.error)); return; }
        } else {
          var mobile = $("us-mobile").value.replace(/\D/g, "");
          if (mobile.length !== 10) { $("us-save").disabled = false; setMsg(msg, "Mobile must be 10 digits"); return; }
          if ($("us-pass").value.length < 6) { $("us-save").disabled = false; setMsg(msg, "Password must be at least 6 characters"); return; }
          profile.phone = mobile;
          r = await adminCall({ action: "create_user", username: mobile, password: $("us-pass").value, profile: profile });
          if (r.error) { $("us-save").disabled = false; setMsg(msg, r.error); return; }
        }
        $("us-save").disabled = false;
        closeModal();
        setMsg($("us-msg"), u ? "Saved" : "Staff created — they can sign in with their mobile number", true);
        load();
      });
    }

    // ---------- Export / template / bulk import ----------
    var IMPORT_COLS = ["name", "mobile", "staff_id", "email", "login_role", "permission_role",
                       "department", "designation", "unit", "schedule",
                       "report1_mobile", "report2_mobile", "report3_mobile", "active"];

    function exportCsv() {
      var out = [IMPORT_COLS].concat(visible().map(function (u) {
        return [u.name, u.username, u.emp_code || "", u.email || "", u.role,
                nameOf("roles", u.role_id), nameOf("departments", u.department_id),
                nameOf("designations", u.designation_id), nameOf("locations", u.location_id),
                nameOf("shifts", u.shift_id),
                byId[u.reporting_to] ? byId[u.reporting_to].username : "",
                byId[u.reporting_to_2] ? byId[u.reporting_to_2].username : "",
                byId[u.reporting_to_3] ? byId[u.reporting_to_3].username : "",
                u.active ? "yes" : "no"];
      }));
      download("staff-" + today() + ".csv", toCsv(out));
    }

    function template() {
      download("staff-import-template.csv", toCsv([
        IMPORT_COLS.concat(["password"]),
        ["Suresh S", "9965028707", "CT002", "suresh@carloo.in", "staff", "Executive",
         "HRD", "HR Manager", "Carloo HO", "HO Staff", "9894021299", "", "", "yes", "Start@123"]
      ]));
    }

    function importDialog() {
      openModal("Bulk import staff",
        '<div class="form-grid">' +
          '<p class="hint">Each row creates a <b>login</b>, so <b>name</b>, <b>mobile</b> ' +
            '(10 digits) and <b>password</b> are required. Department, designation, unit, ' +
            'schedule and permission role are matched <b>by name</b> and must already exist. ' +
            'Reports are matched by <b>mobile number</b>. Mobiles that already have a login ' +
            'are skipped. Use <b>Template</b> for the exact columns.</p>' +
          '<input class="txt" id="us-file" type="file" accept=".csv,text/csv">' +
          '<div id="us-preview"></div>' +
          '<div class="msg" id="us-imsg"></div>' +
          '<div class="modal-acts">' +
            '<button class="mini" id="us-icancel" type="button">Cancel</button>' +
            '<button class="go compact" id="us-igo" type="button" disabled>Import</button>' +
          '</div>' +
        '</div>');

      var pending = [];
      $("us-icancel").addEventListener("click", closeModal);

      function lookup(list, name) {
        if (!name) return null;
        var hit = lists[list].filter(function (x) {
          return x.name.toLowerCase() === String(name).trim().toLowerCase();
        })[0];
        return hit ? hit.id : null;
      }
      function byMobile(m) {
        var d = String(m || "").replace(/\D/g, "");
        if (!d) return null;
        var hit = staff.filter(function (x) { return x.username === d; })[0];
        return hit ? hit.id : null;
      }

      $("us-file").addEventListener("change", function () {
        var f = this.files && this.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onload = function () {
          var grid = parseCsv(String(reader.result));
          if (!grid.length) { setMsg($("us-imsg"), "That file is empty"); return; }
          var head = grid[0].map(function (h) { return h.trim().toLowerCase(); });
          var col = function (r, k) { var i = head.indexOf(k); return i === -1 ? "" : (r[i] || "").trim(); };
          if (head.indexOf("name") === -1 || head.indexOf("mobile") === -1) {
            setMsg($("us-imsg"), 'The file needs at least "name" and "mobile" columns'); return;
          }

          var taken = {}, problems = [], seen = {};
          staff.forEach(function (x) { taken[x.username] = true; });
          pending = [];
          grid.slice(1).forEach(function (r, i) {
            var line = i + 2;
            var name = col(r, "name");
            var mobile = col(r, "mobile").replace(/\D/g, "");
            var pass = col(r, "password");
            if (!name && !mobile) return;
            if (!name) { problems.push("line " + line + ": no name"); return; }
            if (mobile.length !== 10) { problems.push("line " + line + ": mobile must be 10 digits"); return; }
            if (taken[mobile] || seen[mobile]) { problems.push("line " + line + ": " + mobile + " already has a login"); return; }
            if (pass.length < 6) { problems.push("line " + line + ": password must be at least 6 characters"); return; }
            seen[mobile] = true;

            var role = col(r, "login_role").toLowerCase();
            pending.push({
              username: mobile,
              password: pass,
              profile: {
                name: name,
                phone: mobile,
                role: LOGIN_ROLES.indexOf(role) === -1 ? "staff" : role,
                emp_code: col(r, "staff_id") || null,
                email: col(r, "email") || null,
                role_id: lookup("roles", col(r, "permission_role")),
                department_id: lookup("departments", col(r, "department")),
                designation_id: lookup("designations", col(r, "designation")),
                location_id: lookup("locations", col(r, "unit")),
                shift_id: lookup("shifts", col(r, "schedule")),
                reporting_to: byMobile(col(r, "report1_mobile")),
                reporting_to_2: byMobile(col(r, "report2_mobile")),
                reporting_to_3: byMobile(col(r, "report3_mobile")),
                active: head.indexOf("active") === -1 ? true : truthy(col(r, "active"))
              }
            });
          });

          $("us-preview").innerHTML = '<div class="panel state" style="padding:14px;text-align:left">' +
            '<b>' + pending.length + '</b> to create' +
            (problems.length ? ' · <b>' + problems.length + '</b> skipped' : '') +
            (problems.length ? '<br><span class="hint">' + esc(problems.slice(0, 6).join("; ")) +
              (problems.length > 6 ? "; …" : "") + '</span>' : '') +
            '</div>';
          setMsg($("us-imsg"), "");
          $("us-igo").disabled = pending.length === 0;
        };
        reader.readAsText(f);
      });

      $("us-igo").addEventListener("click", async function () {
        if (!pending.length) return;
        $("us-igo").disabled = true;
        setMsg($("us-imsg"), "Creating " + pending.length + " logins… this can take a moment", true);
        var r = await adminCall({ action: "create_many", users: pending });
        if (r.error) { $("us-igo").disabled = false; setMsg($("us-imsg"), r.error); return; }
        closeModal();
        var failed = (r.failed || []).length;
        setMsg($("us-msg"),
          "Created " + r.created + (failed ? " · " + failed + " failed: " +
            r.failed.slice(0, 3).map(function (x) { return x.username + " (" + x.error + ")"; }).join("; ") : ""),
          !failed);
        load();
      });
    }

    load();
  }

  // ---------- Permission matrix ----------
  // One row per menu, one column per role in the Role master. Writes
  // team2.role_permissions, which RLS reads back through team2.matrix_access().
  var ACCESS_LEVELS = [
    { v: "none",     label: "No access" },
    { v: "view_own", label: "View \u2013 Own" },
    { v: "view_all", label: "View \u2013 All" },
    { v: "edit_own", label: "Edit \u2013 Own" },
    { v: "edit_all", label: "Edit \u2013 All" }
  ];

  var TICK = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
             'stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
  var LOCK = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
             'stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
             '<path d="M6 10.5h12v9H6zM8.5 10.5V7a3.5 3.5 0 0 1 7 0v3.5"/></svg>';

  function renderPermissions(host) {
    var roles = [], current = {}, pending = {};

    host.innerHTML =
      '<div class="panel toolbar">' +
        '<span class="hint" style="flex:1 1 220px">Control which role can reach each menu, and ' +
          'whether it may edit. Superadmin and admin always have every right.</span>' +
        '<button class="mini" id="pm-reset" type="button" disabled>Discard changes</button>' +
        '<button class="go compact" id="pm-save" type="button" disabled>Save changes</button>' +
      '</div>' +
      '<div class="msg" id="pm-msg" style="margin:10px 0"></div>' +
      '<div id="pm-host"><div class="panel state">Loading…</div></div>';

    $("pm-save").addEventListener("click", save);
    $("pm-reset").addEventListener("click", function () { pending = {}; paint(); });

    function key(roleId, menuId) { return roleId + "|" + menuId; }

    function levelOf(roleId, menuId) {
      var k = key(roleId, menuId);
      if (pending[k] !== undefined) return pending[k];
      return current[k] !== undefined ? current[k] : "none";
    }

    function dirtyCount() { return Object.keys(pending).length; }

    function paint() {
      var host2 = $("pm-host");
      if (!roles.length) {
        host2.innerHTML = '<div class="panel state">No roles yet — add them in ' +
          '<b>Masters &rsaquo; Role</b> first, then set their rights here.</div>';
        return;
      }

      var head = '<thead><tr><th class="page-col">Page</th>' +
        '<th>Superadmin ' + LOCK + '</th>' +
        roles.map(function (r) {
          return '<th>' + esc(r.name) + (r.is_admin ? " " + LOCK : "") + '</th>';
        }).join("") + '</tr></thead>';

      var body = "";
      GROUP_ORDER.forEach(function (g) {
        var items = MENUS.filter(function (m) { return m.group === g; });
        if (!items.length) return;
        body += '<tr class="group-row"><td colspan="' + (roles.length + 2) + '">' + esc(g) + '</td></tr>';
        items.forEach(function (m) {
          body += '<tr><td class="page-col">' + m.label + '</td>' +
            '<td class="locked-col">' + TICK + '</td>' +
            roles.map(function (r) {
              if (r.is_admin) return '<td class="locked-col">' + TICK + '</td>';
              var lvl = levelOf(r.id, m.id);
              var isDirty = pending[key(r.id, m.id)] !== undefined;
              return '<td><select class="cell' + (isDirty ? " dirty" : "") + '" data-level="' + lvl + '" ' +
                'data-role="' + r.id + '" data-menu="' + m.id + '">' +
                ACCESS_LEVELS.map(function (a) {
                  return '<option value="' + a.v + '"' + (a.v === lvl ? " selected" : "") + '>' + a.label + '</option>';
                }).join("") + '</select></td>';
            }).join("") + '</tr>';
        });
      });

      host2.innerHTML = '<div class="matrix-wrap"><table class="matrix">' + head +
        '<tbody>' + body + '</tbody></table></div>' +
        '<div class="legend">' +
          '<span class="key">No access</span> — the menu is hidden &nbsp;·&nbsp; ' +
          '<span class="key">View \u2013 Own</span> — read only, their own records and anyone reporting to them &nbsp;·&nbsp; ' +
          '<span class="key">View \u2013 All</span> — read every record<br>' +
          '<span class="key">Edit \u2013 Own</span> — view and change their own and their team\u2019s &nbsp;·&nbsp; ' +
          '<span class="key">Edit \u2013 All</span> — view and change everything &nbsp;·&nbsp; ' +
          '<span class="key">' + TICK + '</span> always on, cannot be changed<br>' +
          'On masters, <b>Own</b> means rows the user created or rows at their own unit. ' +
          'A role with no row set behaves as readable, so a half-filled matrix never locks anyone out. ' +
          '<b>Everyone always sees their own records</b>, whatever this says. ' +
          'Delete is manager-and-above and is deliberately not part of this matrix.' +
        '</div>';

      host2.querySelectorAll("select.cell").forEach(function (sel) {
        sel.addEventListener("change", function () {
          var k = key(sel.dataset.role, sel.dataset.menu);
          var was = current[k] !== undefined ? current[k] : "none";
          if (sel.value === was) delete pending[k]; else pending[k] = sel.value;
          sel.dataset.level = sel.value;
          sel.classList.toggle("dirty", pending[k] !== undefined);
          refreshButtons();
        });
      });
      refreshButtons();
    }

    function refreshButtons() {
      var n = dirtyCount();
      $("pm-save").disabled = n === 0;
      $("pm-reset").disabled = n === 0;
      $("pm-save").textContent = n ? "Save " + n + " change" + (n === 1 ? "" : "s") : "Save changes";
    }

    async function load() {
      var rr = await sb.from("roles").select("*").eq("active", true).order("role_code");
      if (rr.error) {
        $("pm-host").innerHTML = '<div class="panel state">Could not load roles — ' + esc(rr.error.message) + '</div>';
        return;
      }
      roles = rr.data || [];

      var pr = await sb.from("role_permissions").select("role_id, menu_id, access");
      current = {};
      if (!pr.error && pr.data) {
        pr.data.forEach(function (x) { current[key(x.role_id, x.menu_id)] = x.access; });
      }
      pending = {};
      paint();
    }

    async function save() {
      var rows = Object.keys(pending).map(function (k) {
        var parts = k.split("|");
        return { role_id: parts[0], menu_id: parts[1], access: pending[k], updated_by: me.id };
      });
      if (!rows.length) return;
      $("pm-save").disabled = true;
      setMsg($("pm-msg"), "Saving " + rows.length + "…", true);
      var r = await sb.from("role_permissions").upsert(rows, { onConflict: "role_id,menu_id" });
      if (r.error) { $("pm-save").disabled = false; setMsg($("pm-msg"), saveError(r.error)); return; }
      rows.forEach(function (x) { current[key(x.role_id, x.menu_id)] = x.access; });
      pending = {};
      paint();
      setMsg($("pm-msg"), "Saved. Each user picks this up next time they sign in or reload.", true);
    }

    load();
  }

  // WhatsApp-style preview of an approved template, placeholders highlighted.
  // Accepts the whole webhook link or just its id.
  function webhookIdOf(v) {
    v = String(v || "").trim();
    var m = /webhook\.whatapi\.in\/webhook\/([A-Za-z0-9_-]+)/i.exec(v);
    if (m) return m[1];
    return /^[A-Za-z0-9_-]{8,}$/.test(v) ? v : null;

    hooks = hooks || {};

      return '<div class="wa-card">' +
        '<div class="wa-card-head"><b>' + esc(t.label || k) + '</b>' +

        '<div class="wa-stage"><div class="wa-bubble">' +
          (t.header === "image" ? '<div class="wa-img">' + svg("grid", 26) + '</div>' : '') +
          '<div class="wa-text">' + body + '</div>' +
          (t.button ? '<div class="wa-btn">' + esc(t.button) + '</div>' : '') +
        '</div></div>' +
        '<div class="wa-meta">' + esc(t.purpose || "") +
          ' · ' + (t.variables || 0) + ' placeholder' + (t.variables === 1 ? "" : "s") +
          (t.header === "image" ? ' · image header' : '') +
          (t.expiry_minutes ? ' · expires in ' + t.expiry_minutes + ' min' : '') +
        '</div>' +
        '<div class="wa-tools">' +
          '<div class="field"><label for="wa-hook-' + k + '">Webhook link ' +
            '<span class="saved-tag">' + (hooks[k] ? "· saved" : "· not set") + '</span></label>' +
            '<input class="txt" id="wa-hook-' + k + '" type="text" autocomplete="off" ' +
              'placeholder="https://webhook.whatapi.in/webhook/…"></div>' +
          '<span class="sec-title">Send a test</span>' +
          '<input class="txt" id="wa-to-' + k + '" type="tel" inputmode="numeric" autocomplete="off" ' +
            'placeholder="Mobile, e.g. 9894021299">' +
          '<div class="wa-vars">' +
            Array.from({ length: t.variables || 0 }, function (_, i) {
              return '<input class="txt" id="wa-v' + (i + 1) + '-' + k + '" type="text" autocomplete="off" ' +
                'placeholder="{{' + (i + 1) + '}}' + (k === "otp" ? " — code" : "") + '">';
            }).join("") +
          '</div>' +
          (t.header === "image"
            ? '<input class="txt" id="wa-img-' + k + '" type="url" autocomplete="off" placeholder="Image link (https://…)">'
            : '') +
          '<button class="go compact" id="wa-send-' + k + '" type="button">Send test</button>' +
          '<div class="msg" id="wa-msg-' + k + '" style="text-align:left"></div>' +
        '</div></div>';
    }).join("");

    // Pre-fill a random code for the OTP test so it looks like the real thing.
    if ($("wa-v1-otp")) $("wa-v1-otp").value = String(Math.floor(100000 + Math.random() * 900000));

    keys.forEach(function (k) {
      var t = templates[k] || {};
      var btn = $("wa-send-" + k);
      if (!btn) return;
      btn.addEventListener("click", async function () {
        var msg = $("wa-msg-" + k);
        var vars = Array.from({ length: t.variables || 0 }, function (_, i) {
          return ($("wa-v" + (i + 1) + "-" + k).value || "").trim();
        });
        if (!$("wa-to-" + k).value.trim()) { setMsg(msg, "Enter a mobile number"); return; }
        if (vars.some(function (v) { return !v; })) { setMsg(msg, "Fill every placeholder"); return; }
        if (vars.some(function (v) { return v.indexOf(",") !== -1; })) {

      });
    });

  // DLT SMS templates: preview, then a test send that fills {#var#}.
  function renderSmsTemplates(host, templates) {
    var keys = Object.keys(templates);
    if (!keys.length) { host.innerHTML = '<div class="hint">No SMS templates registered.</div>'; return; }
    host.innerHTML = keys.map(function (k) {
      var t = templates[k] || {};
      var slots = (String(t.body || "").match(/\{#var#\}/g) || []).length;
      var body = esc(t.body || "").replace(/\{#var#\}/g, '<span class="sms-var">{#var#}</span>');
      return '<div class="wa-card">' +
        '<div class="wa-card-head"><b>' + esc(t.label || k) + '</b>' +
          '<span>' + esc(t.name || "") + ' · DLT template ' + esc(t.template_id || "—") + '</span></div>' +
        '<div class="wa-stage" style="background:#fff"><div class="sms-bubble">' + body + '</div></div>' +
        '<div class="wa-meta">' + esc(t.purpose || "") + ' · ' + slots + ' placeholder' + (slots === 1 ? "" : "s") +
          (t.expiry_minutes ? ' · valid ' + t.expiry_minutes + ' min' : '') + '</div>' +
        '<div class="wa-tools">' +
          '<span class="sec-title">Send a test</span>' +
          '<input class="txt" id="sms-to-' + k + '" type="tel" inputmode="numeric" autocomplete="off" placeholder="Mobile, e.g. 9894021299">' +
          '<div class="wa-vars">' +
            Array.from({ length: slots }, function (_, i) {
              return '<input class="txt" id="sms-v' + (i + 1) + '-' + k + '" type="text" maxlength="30" autocomplete="off" ' +
                'placeholder="{#var#} ' + (i + 1) + '">';
            }).join("") +
          '</div>' +
          '<button class="go compact" id="sms-send-' + k + '" type="button">Send test SMS</button>' +
          '<div class="msg" id="sms-msg-' + k + '" style="text-align:left"></div>' +
        '</div></div>';
    }).join("");

    keys.forEach(function (k) {
      var t = templates[k] || {};
      var slots = (String(t.body || "").match(/\{#var#\}/g) || []).length;
      // An OTP template gets a realistic code pre-filled.
      if (/otp/i.test(k + " " + (t.name || "")) && $("sms-v1-" + k)) {
        $("sms-v1-" + k).value = String(Math.floor(100000 + Math.random() * 900000));
      }
      var btn = $("sms-send-" + k);
      btn.addEventListener("click", async function () {
        var msg = $("sms-msg-" + k);
        var to = $("sms-to-" + k).value.replace(/\D/g, "");
        if (to.length === 12 && to.indexOf("91") === 0) to = to.slice(2);
        if (!/^[6-9]\d{9}$/.test(to)) { setMsg(msg, "Enter a valid 10-digit mobile number"); return; }
        var vars = Array.from({ length: slots }, function (_, i) {
          return ($("sms-v" + (i + 1) + "-" + k).value || "").trim();
        });
        if (vars.some(function (v) { return !v; })) { setMsg(msg, "Fill every placeholder"); return; }
        btn.disabled = true;
        setMsg(msg, "Sending…", true);
        var r = await fnCall("team2-sms", { action: "send", template: k, to: to, vars: vars });
        btn.disabled = false;
        if (r.error) setMsg(msg, "Not sent — " + r.error);
        else setMsg(msg, "Accepted by the gateway for " + r.to + (r.reply ? " — reply: " + r.reply : ""), true);
        if (renderSmsTemplates.reloadLog) renderSmsTemplates.reloadLog();
      });
    });
  }

    $("set-gmaps-save").addEventListener("click", async function () {

    $("set-gmaps-test").addEventListener("click", async function () {
      var box = $("set-gmaps-msg");
      if (!$("set-gmaps").value.trim() && !GMaps.key()) { setMsg(box, "Enter a key first"); return; }
      // Test what is typed, not only what was saved.
      SETTINGS.google_maps_key = $("set-gmaps").value.trim() || SETTINGS.google_maps_key;

      var byProvider = {};
      (r.data || []).forEach(function (x) { byProvider[x.provider] = x; });

      INTEGRATIONS.forEach(function (it) {
        var row = byProvider[it.provider] || { config: {}, secret: {}, enabled: false };
