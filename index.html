<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2f4bd0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Team2</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
  // Team2 — attendance, leave, permission and field visits.
  // Production host: https://team2.carloo.in (not attached yet).
  // Data lives in the `team2` schema of the carloo-order-management project.
  window.APP_CFG = {
    version: "0.6.0",
    url: "https://thmszlxepqkrcqavlilq.supabase.co",
    key: "sb_publishable_JUznnQZytWQo_l-EC9N3Sw_uCfArTet",

    // Google Maps browser key. Leave "" and every map feature stays off — the app
    // still records raw lat/lng. Enable on the key: Maps JavaScript API,
    // Geocoding API, Places API, Distance Matrix API. Restrict it by HTTP referrer
    // to team2.carloo.in and http://127.0.0.1:8127.
    gmapsKey: ""
  };
</script>
<style>
  :root {
    --bg: #f5f6fa;
    --panel: #ffffff;
    --brand: #2f4bd0;
    --brand-deep: #2439a6;
    --brand-soft: #e9ecfb;
    --ink: #1b2033;
    --text: #2c3244;
    --muted: #878da0;
    --border: #e4e6ef;
    --error: #b3382c;
    --ok: #1c7a4b;
    --warn: #a76a12;
    --shadow: 0 1px 2px rgba(27, 32, 51, 0.06), 0 8px 24px rgba(27, 32, 51, 0.07);
    --serif: Georgia, "Times New Roman", "Noto Serif", serif;
    --pad: max(14px, env(safe-area-inset-left));
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 15px;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
  }
  .screen { display: none; min-height: 100%; }
  .screen.active { display: block; }

  /* ---------- Brand ---------- */
  .brand { display: flex; align-items: center; gap: 11px; user-select: none; }
  .brand .logo {
    width: 42px; height: 42px; border-radius: 13px;
    background: var(--brand); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-size: 22px; font-weight: 700; flex: 0 0 auto;
  }
  .brand .word {
    font-family: var(--serif); font-size: 25px; font-weight: 700;
    color: var(--ink); letter-spacing: 0.01em; line-height: 1.1;
  }
  .brand .sub {
    display: block; font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 9.5px; font-weight: 700; color: var(--muted);
    letter-spacing: 0.15em; text-transform: uppercase; margin-top: 3px;
  }
  .brand.small .logo { width: 34px; height: 34px; border-radius: 10px; font-size: 18px; }
  .brand.small .word { font-size: 19px; }

  /* ---------- Shared ---------- */
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px; box-shadow: var(--shadow);
  }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field label, .sec-title {
    font-size: 11px; color: var(--muted);
    letter-spacing: 0.13em; text-transform: uppercase;
    font-weight: 600; user-select: none;
  }
  input.txt, select.txt, textarea.txt {
    background: #fbfcfe; border: 1px solid var(--border); border-radius: 11px;
    color: var(--text); font: inherit; font-size: 16px;   /* 16px stops iOS zoom-on-focus */
    padding: 12px 13px; outline: none; caret-color: var(--brand); width: 100%;
  }
  input.txt:focus, select.txt:focus, textarea.txt:focus { border-color: var(--brand); background: #fff; }
  button.go {
    background: var(--brand); color: #fff; border: none; border-radius: 11px;
    font: inherit; font-weight: 600; font-size: 16px;
    padding: 14px 0; cursor: pointer; width: 100%;
  }
  button.go:active { background: var(--brand-deep); transform: translateY(1px); }
  button.go[disabled] { opacity: 0.55; }
  .msg { min-height: 18px; font-size: 13px; text-align: center; user-select: none; }
  .msg.err { color: var(--error); }
  .msg.ok  { color: var(--ok); }

  /* ---------- Login (Carloo Tex look) ---------- */
  #scr-login { display: none; }
  #scr-login.active {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh;
    padding: calc(34px + env(safe-area-inset-top)) var(--pad) calc(26px + env(safe-area-inset-bottom));
    background: linear-gradient(135deg, #f6f8fe 0%, #ffffff 48%, #f8f7fd 100%);
    --lg-blue: #4169e1;
  }
  .lg-head { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 30px; }
  .lg-logo { background: #fff; padding: 4px 14px 8px; margin-bottom: 20px; line-height: 1; }
  .lg-wordmark {
    position: relative; display: inline-block;
    font-family: Calibri, Candara, "Segoe UI", system-ui, sans-serif;
    font-size: 62px; font-weight: 400; color: #231f20; letter-spacing: -1.2px;
  }
  .lg-wordmark sup { position: absolute; top: 7px; right: -11px; font-size: 11px; }
  .lg-title { font-size: 28px; font-weight: 700; color: #111827; letter-spacing: -0.01em; }
  .lg-sub { font-size: 15px; color: #4b5563; margin-top: 8px; }
  .lg-ver {
    margin-top: 12px; padding: 2px 10px; border-radius: 999px;
    background: #f3f4f6; border: 1px solid #e5e7eb; color: #374151;
    font-family: ui-monospace, Consolas, "Courier New", monospace; font-size: 10.5px;
  }
  .lg-card {
    width: min(480px, 100%); background: #fff; border-radius: 16px;
    box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08), 0 1px 3px rgba(17, 24, 39, 0.05);
    padding: 34px 34px 30px;
  }
  .lg-tabs {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    background: #f3f4f6; border-radius: 11px; padding: 4px; margin-bottom: 28px;
  }
  .lg-tab {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    border: 0; background: transparent; border-radius: 8px; padding: 10px 4px;
    font: inherit; font-size: 14px; font-weight: 500; color: #6b7280; cursor: pointer;
  }
  .lg-tab svg { flex: 0 0 auto; }
  .lg-tab[aria-selected="true"] { background: #fff; color: var(--lg-blue); box-shadow: 0 1px 3px rgba(17, 24, 39, 0.12); }
  .lg-tab:focus-visible { outline: 2px solid var(--lg-blue); outline-offset: 1px; }
  .lg-h { font-size: 24px; font-weight: 700; color: #111827; }
  .lg-hsub { font-size: 14px; color: #4b5563; margin-top: 6px; }
  .lg-form { display: flex; flex-direction: column; margin-top: 30px; }
  .lg-label { font-size: 15px; font-weight: 500; color: #374151; margin-bottom: 9px; }
  .lg-input {
    height: 52px; width: 100%; padding: 0 18px;
    border: 1px solid #d1d5db; border-radius: 9px; background: #fff;
    font: inherit; font-size: 16px; color: #111827; outline: none; caret-color: var(--lg-blue);
  }
  .lg-input::placeholder { color: #9ca3af; }
  .lg-input:focus { border-color: var(--lg-blue); box-shadow: 0 0 0 3px rgba(65, 105, 225, 0.15); }
  .lg-gap { height: 20px; }
  .lg-btn {
    margin-top: 26px; height: 52px; border: 0; border-radius: 9px;
    background: var(--lg-blue); color: #fff; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .lg-btn:hover { background: #3558c9; }
  .lg-btn:active { transform: translateY(1px); }
  .lg-btn[disabled] { opacity: 0.6; cursor: default; }
  .lg-msg { margin-top: 12px; min-height: 18px; }
  .lg-foot { margin-top: 34px; font-size: 13px; color: #4b5563; text-align: center; }
  @media (max-width: 420px) {
    .lg-card { padding: 26px 20px 22px; }
    .lg-wordmark { font-size: 52px; }
    .lg-title { font-size: 25px; }
    .lg-tab { font-size: 13px; gap: 5px; }
  }

  /* ---------- App shell: top bar + left tree + content ---------- */
  #scr-app.active { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .topbar {
    flex: 0 0 auto; z-index: 30;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: #fff; border-bottom: 1px solid var(--border);
    padding: calc(9px + env(safe-area-inset-top)) var(--pad) 9px;
  }
  .topbar .left, .topbar .right { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .whoami { font-size: 11.5px; color: var(--muted); line-height: 1.3; text-align: right; }
  .whoami b { display: block; color: var(--ink); font-weight: 600; font-size: 13px; }
  .iconbtn {
    background: #fff; border: 1px solid var(--border); border-radius: 11px;
    width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text); flex: 0 0 auto;
  }
  .iconbtn:hover, .iconbtn:active { border-color: var(--brand); color: var(--brand); }
  .only-mobile { display: none !important; }

  .shell { flex: 1 1 auto; display: flex; min-height: 0; position: relative; }

  /* ---------- Left tree ---------- */
  .sidebar {
    flex: 0 0 264px; width: 264px; background: #fff; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  .side-head {
    align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--border);
  }
  .tree { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding: 12px 10px 16px; }
  .side-foot {
    flex: 0 0 auto; border-top: 1px solid var(--border);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 0.15em; text-transform: uppercase;
  }
  .tree button {
    display: flex; align-items: center; width: 100%;
    border: 0; background: transparent; font: inherit; color: var(--text);
    text-align: left; border-radius: 9px; cursor: pointer;
  }
  .tree button:hover { background: #f4f6fb; }
  .tree button:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
  .tree .ic { display: flex; flex: 0 0 auto; color: var(--muted); }
  .tree .lbl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tree-home { gap: 10px; padding: 9px 10px; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .tree-parent {
    gap: 8px; padding: 9px 10px; margin-top: 2px;
    font-size: 11px !important; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase;
    color: var(--muted) !important;
  }
  .tree-parent .chev { display: flex; transition: transform 0.15s; }
  .tree-parent[aria-expanded="false"] .chev { transform: rotate(-90deg); }
  .tree-parent .count {
    margin-left: auto; padding: 1px 7px; border-radius: 999px;
    background: #f0f2f7; font-size: 10px; font-weight: 600; letter-spacing: 0;
  }
  .tree-children { margin: 1px 0 6px 16px; padding-left: 9px; border-left: 1px solid var(--border); }
  .tree-children[hidden] { display: none; }
  .tree-item { gap: 10px; padding: 8px 10px; font-size: 13.5px; }
  .tree [aria-current="page"] { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .tree [aria-current="page"] .ic { color: var(--brand); }
  .tree [aria-current="page"]:hover { background: var(--brand-soft); }

  /* ---------- Content ---------- */
  .content { flex: 1 1 auto; min-width: 0; overflow-y: auto; padding: 22px 28px calc(28px + env(safe-area-inset-bottom)); }
  .content-inner { max-width: 920px; }
  .crumb { font-size: 10.5px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
  .mod-title { font-family: var(--serif); font-size: 24px; font-weight: 700; color: var(--ink); line-height: 1.2; margin-top: 4px; }
  .mod-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
  #modBody { margin-top: 18px; }
  .placeholder {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 44px 20px; text-align: center;
  }
  .placeholder .ic {
    width: 48px; height: 48px; border-radius: 14px;
    background: var(--brand-soft); color: var(--brand);
    display: flex; align-items: center; justify-content: center;
  }
  .placeholder h3 { font-size: 15px; font-weight: 600; color: var(--ink); }
  .placeholder p { font-size: 13px; color: var(--muted); max-width: 340px; line-height: 1.55; }
  button.go.compact { width: auto; padding: 11px 20px; margin-top: 6px; font-size: 14px; }

  /* ---------- Master list (Unit) ---------- */
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 14px 16px; }
  .toolbar .search { flex: 1 1 200px; }
  .chk { display: flex; align-items: center; gap: 7px; cursor: pointer; user-select: none;
         font-size: 12.5px; color: var(--muted); flex: 0 0 auto; }
  .chk input { accent-color: var(--brand); width: 15px; height: 15px; }
  .rows { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .row-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow); padding: 14px 16px;
    display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap;
  }
  .row-main { flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .row-code { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row-name { font-size: 15px; font-weight: 600; color: var(--ink); }
  .row-meta { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .row-acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
          padding: 4px 9px; border-radius: 999px; flex: 0 0 auto; }
  .pill.on { background: var(--brand-soft); color: var(--brand-deep); }
  .pill.off { background: #f0f0ef; color: #8a8a86; }
  .pill.geo { background: #eef7f1; color: #1c7a4b; }
  button.mini {
    background: #fff; border: 1px solid var(--border); color: var(--text);
    font: inherit; font-size: 12.5px; font-weight: 600; border-radius: 9px; padding: 7px 12px; cursor: pointer;
  }
  button.mini:hover { border-color: var(--brand); color: var(--brand); }
  button.mini.danger:hover { border-color: var(--error); color: var(--error); }
  .state { padding: 34px 20px; text-align: center; color: var(--muted); font-size: 13.5px; }

  /* ---------- Modal ---------- */
  .modal { position: fixed; inset: 0; z-index: 60; background: rgba(27, 32, 51, 0.42);
           display: flex; align-items: center; justify-content: center; padding: 18px; }
  .modal[hidden] { display: none; }
  .modal-card { width: min(560px, 100%); max-height: 92vh; overflow-y: auto;
                display: flex; flex-direction: column; gap: 16px; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .modal-head h3 { font-family: var(--serif); font-size: 19px; font-weight: 700; color: var(--ink); }
  .form-grid { display: flex; flex-direction: column; gap: 13px; }
  .form-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
  .form-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; }
  .time-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .sec-note { font-size: 12px; color: var(--muted); line-height: 1.45; }
  .sec-note b { color: var(--ink); font-weight: 600; }
  .count-badge {
    display: inline-flex; align-items: center; gap: 4px; margin-left: 8px;
    padding: 2px 8px; border-radius: 999px; background: #f0f2f7; color: var(--muted);
    font-size: 11px; font-weight: 600; vertical-align: middle;
  }
  @media (max-width: 560px) {
    .form-2, .form-3 { grid-template-columns: 1fr; }
  }
  textarea.txt { resize: vertical; min-height: 64px; font-family: inherit; }
  .modal-acts { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
  .sec {
    border-top: 1px solid var(--border); padding-top: 14px; margin-top: 2px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .radio-row { display: flex; gap: 18px; flex-wrap: wrap; }
  .radio-row label { display: flex; align-items: center; gap: 7px; cursor: pointer; font-size: 14px; }
  .radio-row input { accent-color: var(--brand); width: 16px; height: 16px; }
  .map-box { height: 300px; border: 1px solid var(--border); border-radius: 11px; overflow: hidden; background: #eef0f6; position: relative; }
  .map-off { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
             gap: 8px; text-align: center; padding: 20px; color: var(--muted); font-size: 13px; background: #fdf6f4; }
  .map-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.45; }
  .hint b { color: var(--ink); font-weight: 600; }

  .scrim { display: none; }

  /* ---------- Phones and small tablets: the tree becomes a slide-in drawer ---------- */
  @media (max-width: 899px) {
    .only-mobile { display: flex !important; }
    .sidebar {
      position: fixed; z-index: 40; top: 0; bottom: 0; left: 0;
      width: min(292px, 84vw); padding-top: env(safe-area-inset-top);
      box-shadow: 0 0 40px rgba(27, 32, 51, 0.18);
      transform: translateX(-100%); visibility: hidden;
      transition: transform 0.2s ease, visibility 0s linear 0.2s;
    }
    .shell.drawer-open .sidebar { transform: none; visibility: visible; transition: transform 0.2s ease; }
    .scrim {
      display: block; position: fixed; inset: 0; z-index: 35;
      background: rgba(27, 32, 51, 0.35); opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .shell.drawer-open .scrim { opacity: 1; pointer-events: auto; }
    .content { padding: 16px var(--pad) calc(24px + env(safe-area-inset-bottom)); }
    .mod-title { font-size: 21px; }
    .tree-item { padding: 10px 10px; font-size: 14.5px; }   /* bigger touch targets */
  }
</style>
</head>
<body>

<!-- ============ Login ============ -->
<!-- Modelled on the Carloo Tex Field Force Management login, without the Gate tab. -->
<section class="screen active" id="scr-login">
  <div class="lg-head">
    <div class="lg-logo" role="img" aria-label="Carloo"><span class="lg-wordmark">Carloo<sup>&reg;</sup></span></div>
    <h1 class="lg-title">Carloo Tex</h1>
    <p class="lg-sub">Field Force Management</p>
    <span class="lg-ver" id="loginVer"></span>
  </div>

  <div class="lg-card">
    <div class="lg-tabs" role="tablist" aria-label="Sign in as">
      <button type="button" class="lg-tab" role="tab" data-mode="admin" aria-selected="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Admin
      </button>
      <button type="button" class="lg-tab" role="tab" data-mode="team" aria-selected="false" tabindex="-1">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Team
      </button>
      <button type="button" class="lg-tab" role="tab" data-mode="visitor" aria-selected="false" tabindex="-1">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M2 21a8 8 0 0 1 13.29-5.96M10 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM16 19l2 2 4-4"/></svg>
        Visitor
      </button>
    </div>

    <h2 class="lg-h" id="lgHead">Admin Sign In</h2>
    <p class="lg-hsub" id="lgSub">Manage staff, visits &amp; approvals</p>

    <form class="lg-form" id="loginForm" autocomplete="off">
      <label class="lg-label" for="f-u">Mobile Number</label>
      <input class="lg-input" id="f-u" name="pl-k41c" type="tel" inputmode="numeric" maxlength="10"
             placeholder="Mobile number" autocapitalize="none" autocomplete="off" spellcheck="false"
             readonly onfocus="this.removeAttribute('readonly')">
      <div class="lg-gap"></div>
      <label class="lg-label" for="f-p">Password</label>
      <input class="lg-input" id="f-p" name="pl-q78x" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
             autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly')">
      <button class="lg-btn" type="submit" id="loginBtn">Login as Admin</button>
      <div class="msg lg-msg" id="loginMsg" role="status" aria-live="polite"></div>
    </form>
  </div>

  <p class="lg-foot">&copy; <span id="lgYear">2026</span> Carloo Tex. All rights reserved.</p>
</section>

<!-- ============ App: top bar + left tree menu + content ============ -->
<section class="screen" id="scr-app">
  <header class="topbar">
    <div class="left">
      <button class="iconbtn only-mobile" id="btnDrawer" type="button"
              aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

            <path d="M14.5 4.5h3.6A1.4 1.4 0 0 1 19.5 6v12a1.4 1.4 0 0 1-1.4 1.4h-3.6M10 16l-4-4 4-4M6 12h9"/>

  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar" aria-label="Main menu">

          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>

</section>

<!-- ============ Modal (forms & confirmations) ============ -->
<div class="modal" id="modal" hidden>
  <div class="modal-card panel">
    <div class="modal-head">
      <h3 id="modalTitle"></h3>
      <button class="iconbtn" id="modalX" type="button" title="Close" aria-label="Close">

             stroke-width="1.8" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      </button>

    <div id="modalBody"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var CFG = window.APP_CFG;

  // ---------- Supabase (data lives in the `team2` schema) ----------
  var sb = window.supabase.createClient(CFG.url, CFG.key, {
    db: { schema: "team2" },
    auth: { persistSession: true, autoRefreshToken: true, storageKey: "team2.auth" }
  });
  var emailOf = function (u) { return u.toLowerCase() + "@team2.app"; };

  var me = null;        // signed-in profile row
  var myAccess = {};    // menu_id -> access level, from the permission matrix

  // ---------- Icons (24x24, stroked) ----------
  var ICONS = {
    home:     "M4.5 10.6 12 4.4l7.5 6.2V19a1 1 0 0 1-1 1h-4.3v-5.4H9.8V20H5.5a1 1 0 0 1-1-1z",
    clock:    "M12 20.4a8.4 8.4 0 1 0 0-16.8 8.4 8.4 0 0 0 0 16.8zM12 7.4V12l3 1.8",
    calendar: "M5 6.4h14v13H5zM5 10.2h14M8.6 4.4v3M15.4 4.4v3M8.6 13.4h1.4M15 13.4h.02M8.6 16.4h1.4M15 16.4h.02",

    route:    "M6.8 20.4a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4zM17.2 8a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4zM17.2 8.2v3a3.4 3.4 0 0 1-3.4 3.4h-3.6a3.4 3.4 0 0 0-3.4 3.4v.2",
    bag:      "M4.6 8.4h14.8v10.6H4.6zM9 8.4V6.2a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2.2M4.6 12.6h14.8",
    hourglass:"M7.4 4.4h9.2M7.4 19.6h9.2M8.4 4.4v3.2L12 11l3.6-3.4V4.4M8.4 19.6v-3.2L12 13l3.6 3.4v3.2",
    edit:     "M4.6 19.4h4l9.4-9.4a1.8 1.8 0 0 0 0-2.6l-1.4-1.4a1.8 1.8 0 0 0-2.6 0L4.6 15.4zM13.8 7.2l3 3",
    check:    "M12 20.4a8.4 8.4 0 1 0 0-16.8 8.4 8.4 0 0 0 0 16.8zM8.2 12.2l2.6 2.6 5-5.2",
    building: "M4.6 20h14.8M6.4 20V5.2a1 1 0 0 1 1-1h5.2a1 1 0 0 1 1 1V20M13.6 9.6h4a1 1 0 0 1 1 1V20M9 8h1.6M9 11.4h1.6M9 14.8h1.6M15.8 13h1M15.8 16.4h1",
    tag:      "M4.8 11.6V5.6a.8.8 0 0 1 .8-.8h6a.8.8 0 0 1 .57.23l6.9 6.9a.8.8 0 0 1 0 1.14l-5.9 5.9a.8.8 0 0 1-1.14 0l-6.9-6.9a.8.8 0 0 1-.23-.57zM8.4 8.6h.02",
    map:      "M4.6 6.6l4.8-2 5.2 2 4.8-2v12.8l-4.8 2-5.2-2-4.8 2zM9.4 4.6v12.8M14.6 6.6v12.8",
    grid:     "M4.5 4.5h5.5v5.5H4.5zM14 4.5h5.5v5.5H14zM4.5 14h5.5v5.5H4.5zM14 14h5.5v5.5H14z",
    badge:    "M5.6 4.8h12.8a1 1 0 0 1 1 1v12.4a1 1 0 0 1-1 1H5.6a1 1 0 0 1-1-1V5.8a1 1 0 0 1 1-1zM9.6 4.8V3.6h4.8v1.2M12 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM8.7 16.6a3.4 3.4 0 0 1 6.6 0",
    star:     "M12 4.2l2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4L4.2 9.9l5.4-.8z",
    list:     "M8 7.4h11M8 12h11M8 16.6h11M4.9 7.4h.02M4.9 12h.02M4.9 16.6h.02",
    key:      "M10.6 13.4a4.4 4.4 0 1 1 3.2 1.3M10.6 13.4L5.2 18.8v1.6h2.6v-1.8h1.8v-1.8h1.6l1.2-1.2M15.6 8.4h.02",
    chart:    "M4.5 19.5h15M7.6 19.5v-5.4M12 19.5V8.6M16.4 19.5v-8.2",
    car:      "M4.8 15.2h14.4M6.4 15.2l1.5-4.7a1.4 1.4 0 0 1 1.33-.98h5.54a1.4 1.4 0 0 1 1.33.98l1.5 4.7M6.4 15.2v2.6M17.6 15.2v2.6M8.4 18.4h.02M15.6 18.4h.02",
    users:    "M9.4 11.6a3.4 3.4 0 1 0 0-6.8 3.4 3.4 0 0 0 0 6.8zM3.4 19.4a6 6 0 0 1 12 0M16.2 5.2a3.4 3.4 0 0 1 0 6.6M17.6 13.9a6 6 0 0 1 3.2 5.5",
    sliders:  "M4.6 7.6h8.8M17.4 7.6h2M4.6 16.4h2.2M11 16.4h8.4M15.4 5.6v4M8.8 14.4v4",
    cog:      "M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.1 13.4l1.9 1.4-1.6 2.8-2.2-.9a7 7 0 0 1-1.9 1.1l-.3 2.4h-3.2l-.3-2.4a7 7 0 0 1-1.9-1.1l-2.2.9L5.8 14.8l1.9-1.4a7 7 0 0 1 0-2.2L5.8 9.8l1.6-2.8 2.2.9a7 7 0 0 1 1.9-1.1l.3-2.4h3.2l.3 2.4a7 7 0 0 1 1.9 1.1l2.2-.9 1.6 2.8-1.9 1.4a7 7 0 0 1 0 2.4z"
  };

  function svg(name, size) {
    var d = ICONS[name] || ICONS.grid;
    return '<svg width="' + (size || 19) + '" height="' + (size || 19) + '" viewBox="0 0 24 24" ' +
           'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" ' +
           'stroke-linejoin="round"><path d="' + d + '"/></svg>';
  }

  // ---------- The menus ----------
  // Every one is an empty screen until its behaviour is specified.
  // For masters, `id` is the table name so the permission matrix keys on one value.
  // `roles` limits who sees the tile; leave it out for "everyone".
  var MENUS = [
    { group: "Daily", id: "punch",         label: "Punch In / Out",  desc: "Mark attendance with GPS",     icon: "clock" },
    { group: "Daily", id: "attendance",    label: "My Attendance",   desc: "Day-wise register",            icon: "calendar" },
    { group: "Daily", id: "visits",        label: "Visits",          desc: "Plan, check in, check out",    icon: "pin" },
    { group: "Daily", id: "visit_tracks",  label: "Live Tracking",   desc: "Where the team is today",      icon: "route" },

    { group: "Requests", id: "leave_requests",      label: "Leave",          desc: "Apply and track leave",   icon: "bag" },
    { group: "Requests", id: "permission_requests", label: "Permission",     desc: "Short leave in hours",    icon: "hourglass" },
    { group: "Requests", id: "regularisations",     label: "Regularisation", desc: "Fix a missed punch",      icon: "edit" },
    { group: "Requests", id: "approvals",           label: "Approvals",      desc: "Act on your team's requests", icon: "check",
      roles: ["superadmin", "admin", "manager"] },

    { group: "Masters", id: "parties",         label: "Customer / Site", desc: "Who the team visits",    icon: "building" },
    { group: "Masters", id: "visit_purposes",  label: "Visit Purpose",   desc: "Reasons for a visit",    icon: "tag" },
    { group: "Masters", id: "locations",       label: "Unit",            desc: "Units, addresses &amp; geofences", icon: "map",
      render: function (h) { renderUnits(h); } },
    { group: "Masters", id: "departments",     label: "Department",      desc: "Departments",            icon: "grid",
      render: function (h) { simpleMaster(h, DEPARTMENTS_M); } },
    { group: "Masters", id: "designations",    label: "Designation",     desc: "Job titles",             icon: "badge",
      render: function (h) { simpleMaster(h, DESIGNATIONS_M); } },
    { group: "Masters", id: "shifts",          label: "Schedule",        desc: "Timings, breaks &amp; permission", icon: "clock",
      render: function (h) { renderSchedules(h); } },
    { group: "Masters", id: "holidays",        label: "Holiday",         desc: "Holiday calendar",       icon: "star" },
    { group: "Masters", id: "leave_types",     label: "Leave Type",      desc: "Quotas &amp; rules",         icon: "list" },
    { group: "Masters", id: "roles",           label: "Role",            desc: "Login roles",            icon: "key" },

    { group: "Reports", id: "reports", label: "Reports",           desc: "Attendance, leave, visits", icon: "chart" },
    { group: "Reports", id: "trips",   label: "Travel / Distance", desc: "Km travelled &amp; claims",     icon: "car" },

    { group: "Admin", id: "users",       label: "User Master", desc: "Logins &amp; reporting line", icon: "users",
      roles: ["superadmin", "admin"] },
    { group: "Admin", id: "permissions", label: "Permissions", desc: "What each role can do",   icon: "sliders",
      roles: ["superadmin", "admin"] },
    { group: "Admin", id: "settings",    label: "Settings",    desc: "Tracking &amp; punch rules",  icon: "cog",
      roles: ["superadmin", "admin"] }
  ];

  var GROUP_ORDER = ["Daily", "Requests", "Masters", "Reports", "Admin"];

  var MENU_BY_ID = {};
  MENUS.forEach(function (m) { MENU_BY_ID[m.id] = m; });

  // ---------- Screens ----------
  function show(id) {
    ["scr-login", "scr-app"].forEach(function (s) {
      $(s).classList.toggle("active", s === id);
    });
    window.scrollTo(0, 0);
  }

  function setMsg(el, text, ok) {
    el.textContent = text || "";
    el.classList.toggle("err", !!text && !ok);
    el.classList.toggle("ok", !!text && !!ok);
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // ---------- Permission matrix, as it applies to the signed-in user ----------
  // Mirrors team2.can_view / can_edit in the database. The database is what
  // actually protects the data; this only decides which tiles are shown.
  async function loadMyAccess() {
    myAccess = {};
    if (!me || !me.role_id) return;
    var r = await sb.from("role_permissions").select("menu_id, access").eq("role_id", me.role_id);
    if (r.error || !r.data) return;
    r.data.forEach(function (row) { myAccess[row.menu_id] = row.access; });
  }

  function menuVisible(m) {
    if (m.roles && m.roles.indexOf(me.role) === -1) return false;
    if (me.role === "superadmin" || me.role === "admin") return true;
    var a = myAccess[m.id];
    if (a === undefined) return true;    // matrix says nothing — stay visible
    return a !== "none";
  }

  // ---------- Left tree menu ----------
  // Groups are branches, menus are leaves. Which branches are collapsed is
  // remembered per browser; opening a menu always expands its branch.
  var currentId = null;   // null = Home
  var treeCollapsed = {};
  try { treeCollapsed = JSON.parse(localStorage.getItem("team2.treeCollapsed") || "{}") || {}; }
  catch (e) { treeCollapsed = {}; }

  var CHEVRON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
                'stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';

  // Menu labels carry HTML entities (&amp;); a title attribute needs plain text.
  function plain(html) {
    var t = document.createElement("textarea");
    t.innerHTML = html;
    return t.value;
  }

  function groupKey(g) { return "tg-" + g.toLowerCase(); }

  function renderTree() {
    var host = $("treeHost");
    host.innerHTML = "";

    var home = document.createElement("button");
    home.type = "button";
    home.className = "tree-home";
    home.dataset.id = "";
    home.innerHTML = '<span class="ic">' + svg("home", 18) + '</span><span class="lbl">Home</span>';
    home.addEventListener("click", goHome);
    host.appendChild(home);

    var mine = MENUS.filter(menuVisible);
    GROUP_ORDER.forEach(function (g) {
      var items = mine.filter(function (m) { return m.group === g; });
      if (!items.length) return;
      var open = !treeCollapsed[g];

      var wrap = document.createElement("div");
      wrap.className = "tree-group";

      var parent = document.createElement("button");
      parent.type = "button";
      parent.className = "tree-parent";
      parent.setAttribute("aria-expanded", open ? "true" : "false");
      parent.setAttribute("aria-controls", groupKey(g));
      parent.innerHTML = '<span class="chev">' + CHEVRON + '</span><span class="lbl">' + g + '</span>' +
                         '<span class="count">' + items.length + '</span>';

      var list = document.createElement("div");
      list.className = "tree-children";
      list.id = groupKey(g);
      list.hidden = !open;
      parent.addEventListener("click", function () { setGroupOpen(g, list.hidden); });

      items.forEach(function (m) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "tree-item";
        b.dataset.id = m.id;
        b.title = plain(m.desc);
        b.innerHTML = '<span class="ic">' + svg(m.icon, 17) + '</span><span class="lbl">' + m.label + '</span>';
        b.addEventListener("click", function () { openModule(m.id); });
        list.appendChild(b);
      });

      wrap.appendChild(parent);
      wrap.appendChild(list);
      host.appendChild(wrap);
    });

    $("sideFoot").textContent = "Team2 " + CFG.version;
    markActive();
  }

  function setGroupOpen(g, open) {
    var list = $(groupKey(g));
    if (!list) return;
    list.hidden = !open;
    list.previousElementSibling.setAttribute("aria-expanded", open ? "true" : "false");
    if (open) delete treeCollapsed[g]; else treeCollapsed[g] = true;
    try { localStorage.setItem("team2.treeCollapsed", JSON.stringify(treeCollapsed)); } catch (e) { /* ignore */ }
  }

  function markActive() {
    document.querySelectorAll("#treeHost [data-id]").forEach(function (b) {
      if ((b.dataset.id || null) === currentId) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    });
  }

  // ---------- Drawer (phones only; on desktop the tree is always visible) ----------
  function openDrawer() {
    $("shell").classList.add("drawer-open");
    $("btnDrawer").setAttribute("aria-expanded", "true");
    var target = document.querySelector('#treeHost [aria-current="page"]') ||
                 document.querySelector("#treeHost button");
    if (target) target.focus();
  }

  function closeDrawer() {
    if (!$("shell").classList.contains("drawer-open")) return;
    $("shell").classList.remove("drawer-open");
    $("btnDrawer").setAttribute("aria-expanded", "false");
  }

  // ---------- Content area ----------
  function openModule(id) {
    var m = MENU_BY_ID[id];
    if (!m) return;
    if (!menuVisible(m)) { goHome(); return; }
    currentId = id;
    setGroupOpen(m.group, true);
    $("modCrumb").textContent = m.group;
    $("modTitle").innerHTML = m.label;
    $("modSub").innerHTML = m.desc;
    var host = $("modBody");
    host.innerHTML = m.render ? "" : placeholderHTML(m);
    if (m.render) m.render(host);
    if (location.hash !== "#" + id) location.hash = "#" + id;
    markActive();
    closeDrawer();
    closeModal();
    show("scr-app");
    $("content").scrollTop = 0;
  }

  function placeholderHTML(m) {
    return '<div class="panel"><div class="placeholder">' +
      '<div class="ic">' + svg(m.icon, 24) + '</div>' +
      '<h3>Nothing here yet</h3>' +
      '<p>&ldquo;' + m.label + '&rdquo; has no screen yet — say what it should show and do, ' +
      'and it gets built here.</p>' +
      '</div></div>';
  }

  function goHome() {
    currentId = null;
    var mine = MENUS.filter(menuVisible);
    var groups = GROUP_ORDER.filter(function (g) {
      return mine.some(function (m) { return m.group === g; });
    });
    $("modCrumb").textContent = "Home";
    $("modTitle").textContent = "Welcome, " + (me.name || me.username);
    $("modSub").textContent = me.role + " \u00b7 Team2 " + CFG.version;
    $("modBody").innerHTML = '<div class="panel"><div class="placeholder">' +
      '<div class="ic">' + svg("grid", 24) + '</div>' +
      '<h3>Choose a menu</h3>' +
      '<p>' + mine.length + ' menus in ' + groups.length + ' groups — ' + esc(groups.join(", ")) + '.</p>' +
      '<button class="go compact only-mobile" type="button" id="homeOpenMenu">Open menu</button>' +
      '</div></div>';
    $("homeOpenMenu").addEventListener("click", openDrawer);
    // Drop the hash without adding a history entry (keeps any ?query, e.g. a share link).
    if (location.hash) history.replaceState(null, "", location.pathname + location.search);
    markActive();
    closeDrawer();
    show("scr-app");
    $("content").scrollTop = 0;
  }

  // ---------- CSV helpers ----------
  function csvCell(v) {
    var t = v == null ? "" : String(v);
    return /[",\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  }

  function toCsv(rows) {
    return rows.map(function (r) { return r.map(csvCell).join(","); }).join("\r\n");
  }

  // Handles quoted fields, embedded commas/newlines and doubled quotes.
  function parseCsv(text) {
    var rows = [], row = [], cell = "", q = false, i;
    text = text.replace(/^\uFEFF/, "");               // strip BOM
    for (i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) {
        if (c === '"') {
          if (text[i + 1] === '"') { cell += '"'; i++; } else q = false;
        } else cell += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
      else if (c !== "\r") cell += c;
    }
    if (cell.length || row.length) { row.push(cell); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (x) { return String(x).trim() !== ""; }); });
  }

  function download(filename, text) {
    var blob = new Blob([text], { type: "text/csv;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }

  function today() { return new Date().toISOString().slice(0, 10); }

  function truthy(v) {
    var t = String(v == null ? "" : v).trim().toLowerCase();
    return !(t === "no" || t === "false" || t === "0" || t === "n" || t === "inactive");
  }

  // ---------- Modal ----------
  function openModal(title, html) {
    $("modalTitle").textContent = title;
    $("modalBody").innerHTML = html;
    $("modal").hidden = false;
  }
  function closeModal() {
    $("modal").hidden = true;
    $("modalBody").innerHTML = "";
  }

  // Mirrors team2.can_edit: admins always, otherwise the matrix, and with no
  // matrix row it falls back to manager-and-above. The database is what enforces it.
  function canEditMenu(id) {
    if (me.role === "superadmin" || me.role === "admin") return true;
    var a = myAccess[id];
    if (a === undefined) return me.role === "manager";
    return a === "edit_own" || a === "edit_all";
  }

  function saveError(err) {
    if (!err) return "Could not save";
    if (err.code === "42501" || /row-level security/i.test(err.message || "")) {
      return "You do not have rights to change this";
    }
    if (err.code === "23505") return "That code or name already exists";
    return err.message || "Could not save";
  }

  // ---------- Simple name-only masters (Department, Designation) ----------
  // One screen, driven by a config, so another such master is a config plus a table.
  var DEPARTMENTS_M = {
    menuId: "departments", table: "departments", codeField: "department_code",
    one: "department", title: "Department",
    placeholder: "e.g. Cutting", sample: ["Cutting", "Sewing", "Quality"]
  };
  var DESIGNATIONS_M = {
    menuId: "designations", table: "designations", codeField: "designation_code",
    one: "designation", title: "Designation",
    placeholder: "e.g. Supervisor", sample: ["Supervisor", "Operator", "Executive"]
  };

  function simpleMaster(host, cfg) {
    var mayEdit = canEditMenu(cfg.menuId);
    var rows = [];

    host.innerHTML =
      '<div class="panel toolbar">' +
        '<input class="txt search" id="sm-search" type="search" placeholder="Search ' + cfg.one + ' name or code">' +
        '<label class="chk"><input type="checkbox" id="sm-inactive"> Show inactive</label>' +
        '<button class="mini" id="sm-export" type="button">Export</button>' +
        (mayEdit ? '<button class="mini" id="sm-import" type="button">Import</button>' : '') +
        (mayEdit ? '<button class="go compact" id="sm-add" type="button">Add ' + cfg.one + '</button>' : '') +
      '</div>' +
      '<div class="rows" id="sm-rows"><div class="panel state">Loading…</div></div>';

    $("sm-search").addEventListener("input", paint);
    $("sm-inactive").addEventListener("change", paint);
    $("sm-export").addEventListener("click", exportCsv);
    if (mayEdit) {

    function visible() {
      var q = $("sm-search").value.trim().toLowerCase();
      var showOff = $("sm-inactive").checked;

    function paint() {
      var list = visible();
      var host2 = $("sm-rows");
      if (!list.length) {

      host2.innerHTML = list.map(function (r) {
        return '<div class="row-card">' +
          '<div class="row-main">' +
            '<span class="row-code">' + esc(r[cfg.codeField]) + '</span>' +
            '<span class="row-name">' + esc(r.name) + '</span>' +
          '</div>' +
          '<div class="row-acts">' +
            '<span class="pill ' + (r.active ? "on" : "off") + '">' + (r.active ? "Active" : "Inactive") + '</span>' +
            (mayEdit ? '<button class="mini" data-edit="' + r.id + '" type="button">Edit</button>' +
                       '<button class="mini danger" data-del="' + r.id + '" type="button">Delete</button>' : '') +
          '</div></div>';
      }).join("");

      host2.querySelectorAll("[data-edit]").forEach(function (b) {
        b.addEventListener("click", function () {
          form(rows.filter(function (r) { return r.id === b.dataset.edit; })[0]);

      host2.querySelectorAll("[data-del]").forEach(function (b) {
        b.addEventListener("click", function () { remove(b.dataset.del); });

    async function load() {
      var r = await sb.from(cfg.table).select("*").order(cfg.codeField);
      if (r.error) {
        $("sm-rows").innerHTML = '<div class="panel state">Could not load — ' + esc(r.error.message) + '</div>';
        return;
      }
      rows = r.data || [];
      paint();
    }

    async function remove(id) {
      var r0 = rows.filter(function (x) { return x.id === id; })[0];
      if (!r0) return;
      if (!window.confirm('Delete "' + r0.name + '"? This cannot be undone.')) return;
      var r = await sb.from(cfg.table).delete().eq("id", id);
      if (r.error) { window.alert(saveError(r.error)); return; }
      load();
    }

    function form(row) {
      openModal(row ? "Edit " + cfg.one : "Add " + cfg.one,
        '<div class="form-grid">' +
          '<div class="field"><label for="sm-name">' + cfg.title + ' name</label>' +
            '<input class="txt" id="sm-name" type="text" placeholder="' + cfg.placeholder + '" autocomplete="off"></div>' +
          '<label class="chk"><input type="checkbox" id="sm-active" checked> Active</label>' +
          '<div class="msg" id="sm-msg"></div>' +
          '<div class="modal-acts">' +
            '<button class="mini" id="sm-cancel" type="button">Cancel</button>' +
            '<button class="go compact" id="sm-save" type="button">Save</button>' +
          '</div>' +
        '</div>');
      $("sm-name").value = row ? row.name : "";
      $("sm-active").checked = row ? !!row.active : true;
      $("sm-cancel").addEventListener("click", closeModal);
      $("sm-name").focus();
      $("sm-save").addEventListener("click", async function () {
        var name = $("sm-name").value.trim();
        if (!name) { setMsg($("sm-msg"), "Enter the " + cfg.one + " name"); return; }
        var clash = rows.some(function (r) {
          return r.name.toLowerCase() === name.toLowerCase() && (!row || r.id !== row.id);
        });
        if (clash) { setMsg($("sm-msg"), "That name already exists"); return; }

        var payload = { name: name, active: $("sm-active").checked };
        $("sm-save").disabled = true;
        setMsg($("sm-msg"), "Saving…", true);
        var r = row
          ? await sb.from(cfg.table).update(payload).eq("id", row.id)
          : await sb.from(cfg.table).insert(Object.assign({ created_by: me.id }, payload));
        $("sm-save").disabled = false;
        if (r.error) { setMsg($("sm-msg"), saveError(r.error)); return; }
        closeModal();
        load();
      });
    }

    function exportCsv() {
      var list = visible();
      var out = [["code", "name", "active"]].concat(list.map(function (r) {
        return [r[cfg.codeField], r.name, r.active ? "yes" : "no"];
      }));
      download(cfg.table + "-" + today() + ".csv", toCsv(out));
    }

    function importDialog() {
      openModal("Import " + cfg.title.toLowerCase() + "s",
        '<div class="form-grid">' +
          '<p class="hint">The file needs a <b>name</b> column. An <b>active</b> column ' +
            '(yes/no) is optional and defaults to yes. The <b>code</b> column is ignored — ' +
            'codes are generated. Names that already exist are skipped.</p>' +
          '<div class="map-tools">' +
            '<button class="mini" id="sm-tpl" type="button">Download template</button>' +
            '<input class="txt" id="sm-file" type="file" accept=".csv,text/csv" style="flex:1 1 180px">' +
          '</div>' +
          '<div id="sm-preview"></div>' +
          '<div class="msg" id="sm-imsg"></div>' +
          '<div class="modal-acts">' +
            '<button class="mini" id="sm-icancel" type="button">Cancel</button>' +
            '<button class="go compact" id="sm-igo" type="button" disabled>Import</button>' +
          '</div>' +
        '</div>');

      var pending = [];
      $("sm-icancel").addEventListener("click", closeModal);
      $("sm-tpl").addEventListener("click", function () {
        var tpl = [["name", "active"]].concat(cfg.sample.map(function (n) { return [n, "yes"]; }));
        download(cfg.table + "-import-template.csv", toCsv(tpl));
      });

      $("sm-file").addEventListener("change", function () {
        var f = this.files && this.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onload = function () {
          var grid = parseCsv(String(reader.result));
          if (!grid.length) { setMsg($("sm-imsg"), "That file is empty"); return; }
          var head = grid[0].map(function (h) { return h.trim().toLowerCase(); });
          var iName = head.indexOf("name");
          var iActive = head.indexOf("active");
          if (iName === -1) { setMsg($("sm-imsg"), 'No "name" column in that file'); return; }

          var seen = {}, dup = 0, blank = 0;
          var existing = {};
          rows.forEach(function (r) { existing[r.name.toLowerCase()] = true; });
          pending = [];
          grid.slice(1).forEach(function (r) {
            var name = (r[iName] || "").trim();
            if (!name) { blank++; return; }
            var key = name.toLowerCase();
            if (existing[key] || seen[key]) { dup++; return; }
            seen[key] = true;
            pending.push({ name: name, active: iActive === -1 ? true : truthy(r[iActive]), created_by: me.id });
          });

          $("sm-preview").innerHTML = '<div class="panel state" style="padding:14px">' +
            '<b>' + pending.length + '</b> to import' +
            (dup ? ' · ' + dup + ' skipped (already exist or repeated)' : '') +
            (blank ? ' · ' + blank + ' blank rows ignored' : '') +
            (pending.length ? '<br><span class="hint">' +
              esc(pending.slice(0, 5).map(function (x) { return x.name; }).join(", ")) +
              (pending.length > 5 ? ", …" : "") + '</span>' : '') +
            '</div>';
          setMsg($("sm-imsg"), "");
          $("sm-igo").disabled = pending.length === 0;
        };
        reader.readAsText(f);
      });

      $("sm-igo").addEventListener("click", async function () {
        if (!pending.length) return;
        $("sm-igo").disabled = true;
        setMsg($("sm-imsg"), "Importing " + pending.length + "…", true);
        var r = await sb.from(cfg.table).insert(pending);
        if (r.error) { $("sm-igo").disabled = false; setMsg($("sm-imsg"), saveError(r.error)); return; }
        closeModal();
        load();
      });
    }

    load();
  }

  // ---------- Schedule master ----------
  // Stored in team2.shifts — the table keeps its name because profiles.shift_id,
  // team2.sync_attendance_day() and role_permissions.menu_id = 'shifts' key on it.
  function hm(t) { return t ? String(t).slice(0, 5) : ""; }

  function schedRange(a, b) {
    return (hm(a) && hm(b)) ? hm(a) + "\u2013" + hm(b) : "";
  }

  function schedSummary(r) {
    var bits = [];
    bits.push(schedRange(r.start_time, r.end_time) || "no timing set");
    if (r.lunch_min) {
      bits.push("lunch " + r.lunch_min + "m" +
                (r.lunch_from ? " (" + schedRange(r.lunch_from, r.lunch_to) + ")" : ""));
    }
    var teas = [r.tea1_min, r.tea2_min, r.tea3_min].filter(function (x) { return x > 0; });
    if (teas.length) bits.push("tea " + teas.join("+") + "m");
    bits.push("perm " + Number(r.permission_hours) + "h/mo");
    return bits.join(" \u00b7 ");
  }

  // "9:00", "09:00", "09:00:00" -> "09:00"; anything else -> null.
  function toTime(v) {
    var m = /^\s*(\d{1,2}):(\d{2})(?::\d{2})?\s*$/.exec(String(v == null ? "" : v));
    if (!m) return null;
    var h = parseInt(m[1], 10), mi = parseInt(m[2], 10);
    if (h > 23 || mi > 59) return null;
    return (h < 10 ? "0" + h : h) + ":" + m[2];
  }

  var SCHED_FIELDS = ["tea1_from", "tea1_to", "tea1_min", "tea2_from", "tea2_to", "tea2_min",
                      "tea3_from", "tea3_to", "tea3_min", "lunch_from", "lunch_to", "lunch_min"];

  function renderSchedules(host) {
    var mayEdit = canEditMenu("shifts");
    var rows = [], counts = {};

    host.innerHTML =
      '<div class="panel toolbar">' +
        '<input class="txt search" id="sc-search" type="search" placeholder="Search schedules by name…">' +
        '<label class="chk"><input type="checkbox" id="sc-inuse"> In use only</label>' +
        '<button class="mini" id="sc-export" type="button">Export</button>' +
        (mayEdit ? '<button class="mini" id="sc-tpl" type="button">Template</button>' : '') +
        (mayEdit ? '<button class="mini" id="sc-import" type="button">Import</button>' : '') +
        (mayEdit ? '<button class="go compact" id="sc-add" type="button">New schedule</button>' : '') +
      '</div>' +
      '<div class="rows" id="sc-rows"><div class="panel state">Loading…</div></div>';

    $("sc-search").addEventListener("input", paint);
    $("sc-inuse").addEventListener("change", paint);
    $("sc-export").addEventListener("click", exportCsv);
    if (mayEdit) {
      $("sc-add").addEventListener("click", function () { form(null); });
      $("sc-tpl").addEventListener("click", template);
      $("sc-import").addEventListener("click", importDialog);
    }

    function visible() {
      var q = $("sc-search").value.trim().toLowerCase();
      var inUse = $("sc-inuse").checked;
      return rows.filter(function (r) {
        if (inUse && !(counts[r.id] > 0)) return false;
        return !q || r.name.toLowerCase().indexOf(q) !== -1;
      });
    }

    function paint() {
      var list = visible();
      var host2 = $("sc-rows");
      if (!list.length) {
        host2.innerHTML = '<div class="panel state">' +
          (rows.length ? "No schedule matches that."
                       : "No schedules yet." + (mayEdit ? " Use <b>New schedule</b> or <b>Import</b>." : "")) +
          '</div>';
        return;
      }
      host2.innerHTML = list.map(function (r) {
        var n = counts[r.id] || 0;
        return '<div class="row-card">' +
          '<div class="row-main">' +
            '<span class="row-name">' + esc(r.name) +
              '<span class="count-badge" title="Staff on this schedule">' +
                svg("users", 12) + n + '</span>' +
            '</span>' +
            '<span class="row-meta">' + esc(schedSummary(r)) + '</span>' +
          '</div>' +
          '<div class="row-acts">' +
            '<span class="pill ' + (r.active ? "on" : "off") + '">' + (r.active ? "Active" : "Inactive") + '</span>' +
            (mayEdit ? '<button class="mini" data-edit="' + r.id + '" type="button">Edit</button>' +
                       '<button class="mini danger" data-del="' + r.id + '" type="button">Delete</button>' : '') +
          '</div></div>';
      }).join("");

      host2.querySelectorAll("[data-edit]").forEach(function (b) {
        b.addEventListener("click", function () {
          form(rows.filter(function (r) { return r.id === b.dataset.edit; })[0]);
        });
      });
      host2.querySelectorAll("[data-del]").forEach(function (b) {
        b.addEventListener("click", function () { remove(b.dataset.del); });
      });
    }

    async function load() {
      var r = await sb.from("shifts").select("*").order("name");
      if (r.error) {
        $("sc-rows").innerHTML = '<div class="panel state">Could not load — ' + esc(r.error.message) + '</div>';
        return;
      }
      rows = r.data || [];
      counts = {};
      var pr = await sb.from("profiles").select("shift_id");
      if (!pr.error && pr.data) {
        pr.data.forEach(function (x) {
          if (x.shift_id) counts[x.shift_id] = (counts[x.shift_id] || 0) + 1;
        });
      }
      paint();
    }

    async function remove(id) {
      var r0 = rows.filter(function (x) { return x.id === id; })[0];
      if (!r0) return;
      var n = counts[id] || 0;
      var warn = n
        ? '"' + r0.name + '" is used by ' + n + ' staff. Deleting it leaves them with no schedule. Continue?'
        : 'Delete "' + r0.name + '"? This cannot be undone.';
      if (!window.confirm(warn)) return;
      var r = await sb.from("shifts").delete().eq("id", id);
      if (r.error) { window.alert(saveError(r.error)); return; }
      load();
    }

    function csvRows(list) {
      return [["name", "check_in", "check_out",
               "tea1_from", "tea1_to", "tea1_min",
               "tea2_from", "tea2_to", "tea2_min",
               "tea3_from", "tea3_to", "tea3_min",
               "lunch_from", "lunch_to", "lunch_min",
               "permission_hours", "active"]].concat(list.map(function (r) {
        return [r.name, hm(r.start_time), hm(r.end_time),
                hm(r.tea1_from), hm(r.tea1_to), r.tea1_min,
                hm(r.tea2_from), hm(r.tea2_to), r.tea2_min,
                hm(r.tea3_from), hm(r.tea3_to), r.tea3_min,
                hm(r.lunch_from), hm(r.lunch_to), r.lunch_min,
                Number(r.permission_hours), r.active ? "yes" : "no"];
      }));
    }

    function exportCsv() { download("schedules-" + today() + ".csv", toCsv(csvRows(visible()))); }

    function template() {
      download("schedules-import-template.csv", toCsv(csvRows([{
        name: "Factory Staff", start_time: "09:00", end_time: "20:00",
        tea1_from: "10:00", tea1_to: "12:00", tea1_min: 15,
        tea2_from: "15:00", tea2_to: "18:00", tea2_min: 15,
        tea3_from: "18:00", tea3_to: "20:00", tea3_min: 15,
        lunch_from: "12:30", lunch_to: "15:00", lunch_min: 45,
        permission_hours: 3, active: true
      }])));
    }

    function importDialog() {
      openModal("Import schedules",
        '<div class="form-grid">' +
          '<p class="hint">The file needs a <b>name</b> column; times are <b>HH:MM</b> ' +
            '(24-hour) and blanks are allowed. Names that already exist are skipped. ' +
            'Use <b>Template</b> on the toolbar for the exact columns.</p>' +
          '<input class="txt" id="sc-file" type="file" accept=".csv,text/csv">' +
          '<div id="sc-preview"></div>' +
          '<div class="msg" id="sc-imsg"></div>' +
          '<div class="modal-acts">' +
            '<button class="mini" id="sc-icancel" type="button">Cancel</button>' +
            '<button class="go compact" id="sc-igo" type="button" disabled>Import</button>' +
          '</div>' +
        '</div>');

      var pending = [];
      $("sc-icancel").addEventListener("click", closeModal);
      $("sc-file").addEventListener("change", function () {
        var f = this.files && this.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onload = function () {
          var grid = parseCsv(String(reader.result));
          if (!grid.length) { setMsg($("sc-imsg"), "That file is empty"); return; }
          var head = grid[0].map(function (h) { return h.trim().toLowerCase(); });
          var iName = head.indexOf("name");
          if (iName === -1) { setMsg($("sc-imsg"), 'No "name" column in that file'); return; }
          var col = function (r, key) { var i = head.indexOf(key); return i === -1 ? "" : (r[i] || ""); };

          var existing = {}, seen = {}, dup = 0, blank = 0;
          rows.forEach(function (r) { existing[r.name.toLowerCase()] = true; });
          pending = [];
          grid.slice(1).forEach(function (r) {
            var name = (r[iName] || "").trim();
            if (!name) { blank++; return; }
            var key = name.toLowerCase();
            if (existing[key] || seen[key]) { dup++; return; }
            seen[key] = true;
            var row = {
              name: name,
              start_time: toTime(col(r, "check_in")),
              end_time: toTime(col(r, "check_out")),
              permission_hours: parseFloat(col(r, "permission_hours")) || 0,
              active: head.indexOf("active") === -1 ? true : truthy(col(r, "active")),
              created_by: me.id
            };
            SCHED_FIELDS.forEach(function (k) {
              row[k] = /_min$/.test(k) ? (parseInt(col(r, k), 10) || 0) : toTime(col(r, k));
            });
            pending.push(row);
          });

          $("sc-preview").innerHTML = '<div class="panel state" style="padding:14px">' +
            '<b>' + pending.length + '</b> to import' +
            (dup ? ' · ' + dup + ' skipped (already exist or repeated)' : '') +
            (blank ? ' · ' + blank + ' blank rows ignored' : '') +
            (pending.length ? '<br><span class="hint">' +
              esc(pending.slice(0, 5).map(function (x) { return x.name; }).join(", ")) +
              (pending.length > 5 ? ", …" : "") + '</span>' : '') +
            '</div>';
          setMsg($("sc-imsg"), "");
          $("sc-igo").disabled = pending.length === 0;
        };
        reader.readAsText(f);
      });

      $("sc-igo").addEventListener("click", async function () {
        if (!pending.length) return;
        $("sc-igo").disabled = true;
        setMsg($("sc-imsg"), "Importing " + pending.length + "…", true);
        var r = await sb.from("shifts").insert(pending);
        if (r.error) { $("sc-igo").disabled = false; setMsg($("sc-imsg"), saveError(r.error)); return; }
        closeModal();
        load();
      });
    }

            '<span class="sec-title">Lunch &amp; permission</span>' +
            '<div class="form-2">' +
              '<div class="field"><label for="sc-lf">Lunch window</label>' +
                '<div class="time-2">' +
                  '<input class="txt" id="sc-lf" type="time"><input class="txt" id="sc-lt" type="time">' +

          '</div>' +

          '<label class="chk"><input type="checkbox" id="sc-active" checked> Active</label>' +

          '<div class="modal-acts">' +
            '<button class="mini" id="sc-cancel" type="button">Cancel</button>' +
            '<button class="go compact" id="sc-save" type="button">' +
